<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Concept — Cutting from Memory</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script>
  // Theme vor dem ersten Zeichnen setzen: ?t=dark | ?t=light, sonst die letzte Wahl.
  (function () {
    try {
      var q = new URLSearchParams(location.search).get("t"), saved = localStorage.getItem("cfm-theme");
      var t = q || saved || "light"; if (q) localStorage.setItem("cfm-theme", q);
      document.documentElement.dataset.theme = t === "dark" ? "dark" : "light";
    } catch (e) {}
  })();
</script>
<style>
:root {
  --bg: #fafaf8; --ink: #0a0a0a; --mute: #7d7d7a; --line: rgba(10,10,10,.15); --line2: rgba(10,10,10,.6); --soft: #efefec; --dot: rgba(10,10,10,.1);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: "Helvetica Neue Light", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(.2,.7,.2,1);
}
[data-theme="dark"] { --bg: #08090a; --ink: #ecece9; --mute: #86878b; --line: rgba(236,236,233,.14); --line2: rgba(236,236,233,.58); --soft: #131416; --dot: rgba(236,236,233,.11); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 300; display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; overflow: hidden; -webkit-tap-highlight-color: transparent; transition: background .35s, color .35s; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---------- Leiste ---------- */
.bar { display: flex; align-items: center; gap: 14px; padding: max(10px, env(safe-area-inset-top)) 28px 10px; border-bottom: 1px solid var(--line); font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.bar a, .bar button { color: inherit; text-decoration: none; background: none; border: 0; padding: 6px 0; letter-spacing: inherit; text-transform: inherit; font: inherit; }
.bar .word { font-family: var(--sans); font-size: 12px; letter-spacing: .26em; white-space: nowrap; }
.crumbs { flex: 1; color: var(--mute); display: flex; gap: 8px; white-space: nowrap; overflow: hidden; min-width: 0; }
.crumbs a:hover { color: var(--ink); } .crumbs .cur { color: var(--ink); }
.bar .tid { display: flex; align-items: center; border: 1px solid var(--line2); }
.bar .tid input { width: 150px; background: none; border: 0; padding: 6px 8px; outline: none; font: inherit; letter-spacing: .06em; }
.bar .tid button { padding: 6px 9px; border-left: 1px solid var(--line2); }
.bar .tool { border: 1px solid var(--line2); padding: 6px 10px; }
.bar .tool:hover, .bar .tid button:hover { background: var(--ink); color: var(--bg); }

#stage { min-height: 0; overflow: hidden; position: relative; background-image: radial-gradient(var(--dot) 1px, transparent 1.3px); background-size: 28px 28px; background-position: 14px 14px; }
.hud { display: flex; justify-content: space-between; gap: 20px; padding: 8px 28px max(8px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); font: 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); min-height: 33px; }
.hud b { color: var(--ink); font-weight: 400; }
.first { animation: viewIn .7s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* Übergänge zwischen den Ebenen: gleiche Elemente (Look-Bild, Piece-Bild, Knoten) bewegen sich wirklich. */
::view-transition-group(*) { animation-duration: .8s; animation-timing-function: var(--ease); }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .5s; }
::view-transition-old(look-img), ::view-transition-new(look-img), ::view-transition-old(piece-img), ::view-transition-new(piece-img) { height: 100%; object-fit: cover; }

.code { font: 10px var(--mono); letter-spacing: .14em; color: var(--mute); text-transform: uppercase; }
.meta { font: 10px/1.7 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.ph { display: grid; place-items: center; text-align: center; font: 9px/1.8 var(--mono); letter-spacing: .12em; color: var(--mute); }
.ph svg { display: block; margin: 0 auto 4px; }
.btn { border: 1px solid var(--line2); background: none; padding: 8px 13px; font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.btn:hover, .btn.on { background: var(--ink); color: var(--bg); }

/* ---------- Index ---------- */
.index { height: 100%; overflow: auto; padding: 0 28px 30px; }
.ih { padding: 20px 0 18px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.ih h1 { margin: 4px 0 0; font-weight: 300; font-size: clamp(30px, 4vw, 56px); line-height: 1; letter-spacing: .01em; text-transform: uppercase; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(190px, 21vw, 300px), 1fr)); gap: 34px 26px; }
.tile { background: none; border: 0; padding: 0; text-align: left; display: block; }
.timg { position: relative; aspect-ratio: 3 / 4; background: var(--soft); overflow: hidden; border: 1px solid var(--line); }
.timg img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s var(--ease); }
.tile:hover .timg img { transform: scale(1.035); }
.tile:hover .timg { border-color: var(--ink); }
.ghost { position: absolute; inset: 0; opacity: 0; transition: opacity .35s; mix-blend-mode: difference; pointer-events: none; }
.tile:hover .ghost { opacity: 1; }
@media (hover: none) { .ghost { opacity: .75; } }
.ti { padding-top: 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.ti h2 { margin: 3px 0 0; font-weight: 300; font-size: clamp(15px, 1.5vw, 20px); text-transform: uppercase; letter-spacing: .02em; }
.ti .meta { text-align: right; flex: none; }

/* ---------- Gemeinsame Bühne für Ebene 1 + 2 ---------- */
.lx { height: 100%; display: flex; flex-direction: column; padding: 0 28px 14px; }
.lh { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 14px 0 12px; }
.lh h1 { margin: 4px 0 0; font-weight: 300; font-size: clamp(24px, 3vw, 42px); line-height: 1; letter-spacing: .01em; text-transform: uppercase; }
.lh .right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.switch { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.switch button { font: 10px var(--mono); border: 1px solid var(--line2); background: none; padding: 5px 9px; letter-spacing: .1em; }
.switch button.on, .switch button:hover { background: var(--ink); color: var(--bg); }
.net { position: relative; flex: 1; min-height: 0; display: grid; grid-template: minmax(0,1fr) / minmax(0,1fr); place-items: center; }
.rings, .wires { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.rings ellipse { fill: none; stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.rings line { stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.wires path { fill: none; stroke: var(--line2); stroke-width: 1; vector-effect: non-scaling-stroke; transition: opacity .3s, stroke .3s; }
.wires path.link { stroke-dasharray: 3 4; }
.wires path.org { stroke-width: 1.6; }
.wires .dim { opacity: .15; }
.l1 .wires { z-index: 3; mix-blend-mode: difference; } .l1 .wires path { stroke: #fff; opacity: .55; }
.l1 .rings { z-index: 0; } .l2 .wires { z-index: 1; } .l2 .rings { z-index: 0; }
@property --r { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
.l2 .wires { -webkit-mask-image: radial-gradient(ellipse at 50% 50%, #000 var(--r), transparent calc(var(--r) + 6%)); mask-image: radial-gradient(ellipse at 50% 50%, #000 var(--r), transparent calc(var(--r) + 6%)); animation: grow 1.2s var(--ease) .3s forwards; }
@keyframes grow { to { --r: 100%; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* Ebene 1: Look-Bild mit angedeutetem Netz */
.hero { position: relative; z-index: 1; height: 84%; aspect-ratio: 3 / 4; background: var(--soft); border: 0; padding: 0; display: block; cursor: pointer; view-transition-name: look-img; }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-wrap { position: relative; z-index: 1; height: 84%; aspect-ratio: 3 / 4; display: grid; }
.hero-wrap .hero { height: 100%; width: 100%; }
.hero-wrap i { position: absolute; width: 16px; height: 16px; border: 0 solid var(--ink); z-index: 2; pointer-events: none; }
.hero-wrap i:nth-of-type(1) { left: -7px; top: -7px; border-width: 1px 0 0 1px; } .hero-wrap i:nth-of-type(2) { right: -7px; top: -7px; border-width: 1px 1px 0 0; }
.hero-wrap i:nth-of-type(3) { left: -7px; bottom: -7px; border-width: 0 0 1px 1px; } .hero-wrap i:nth-of-type(4) { right: -7px; bottom: -7px; border-width: 0 1px 1px 0; }
.dot { position: absolute; z-index: 4; width: 12px; height: 12px; margin: -6px 0 0 -6px; border-radius: 50%; border: 1px solid #fff; background: transparent; padding: 0; mix-blend-mode: difference; }
.l1 .dot { animation: pulse 3.4s ease-in-out infinite; }
.dot:hover { transform: scale(1.7); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,.0); } 50% { box-shadow: 0 0 0 6px rgba(255,255,255,.25); } }
.dot.org { background: #fff; }
.enter { position: absolute; z-index: 5; left: 50%; bottom: 10px; transform: translateX(-50%); background: var(--bg); }
.hint1 { position: absolute; z-index: 5; left: 0; bottom: 6px; }

/* Ebene 2: Netzwerk */
.cn { position: absolute; z-index: 3; left: 50%; top: 50%; width: clamp(84px, 10vw, 132px); margin: 0; transform: translate(-50%, -50%); text-align: center; background: none; border: 0; padding: 0; }
.cn .cth { aspect-ratio: 3 / 4; background: var(--soft); border: 1px solid var(--ink); outline: 4px solid var(--bg); overflow: hidden; view-transition-name: look-img; }
.cn .cth img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cn .code { margin-top: 10px; }
.nd { position: absolute; z-index: 3; transform: translate(-50%, -50%); background: none; border: 0; padding: 0; text-align: center; width: clamp(64px, 8.4vw, 112px); }
.nth { aspect-ratio: 3 / 4; background: var(--soft); border: 1px solid var(--line2); overflow: hidden; display: grid; place-items: center; transition: outline-color .2s; outline: 1px solid transparent; outline-offset: 3px; }
.nth img { width: 100%; height: 100%; object-fit: cover; display: block; }
.nd:hover .nth, .nd.on .nth { outline-color: var(--ink); }
.nd.org .nth { border-color: var(--ink); outline: 1px solid var(--ink); outline-offset: 3px; }
.nlab { margin-top: 8px; animation: labIn .7s var(--ease) .8s both; }
@keyframes labIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.nlab .ref { font: 9.5px var(--mono); letter-spacing: .1em; color: var(--mute); }
.nlab .nm { font-size: clamp(11px, 1.05vw, 14px); text-transform: uppercase; letter-spacing: .03em; line-height: 1.2; margin: 2px auto 0; max-width: 16ch; }
.tag { display: inline-block; border: 1px solid var(--ink); padding: 0 4px; margin-left: 5px; font: 8.5px var(--mono); letter-spacing: .12em; color: var(--ink); vertical-align: 1px; }
.legend { position: absolute; z-index: 5; right: 0; bottom: 6px; display: flex; gap: 16px; font: 9.5px var(--mono); letter-spacing: .1em; color: var(--mute); text-transform: uppercase; }
.legend span::before { content: ""; display: inline-block; width: 18px; border-top: 1px solid var(--line2); vertical-align: middle; margin-right: 6px; }
.legend span.l::before { border-top-style: dashed; }

/* ---------- Ebene 3: Piece ---------- */
.piece { height: 100%; display: grid; grid-template-columns: 170px minmax(0,1.3fr) minmax(330px,.9fr); column-gap: 32px; padding: 0 28px; }
.rail { padding: 18px 0; font: 10px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; overflow: auto; }
.rail .rl { display: block; color: var(--mute); margin-bottom: 14px; text-decoration: none; }
.rail .rl:hover { color: var(--ink); }
.rail ul { list-style: none; margin: 0; padding: 0 0 0 14px; border-left: 1px solid var(--line2); }
.rail li { position: relative; padding: 9px 0 9px 14px; }
.rail li::before { content: ""; position: absolute; left: -15px; top: 50%; width: 14px; border-top: 1px solid var(--line2); }
.rail li button { background: none; border: 0; padding: 0; color: var(--mute); text-align: left; text-transform: uppercase; letter-spacing: inherit; font: inherit; line-height: 1.5; }
.rail li.cur button { color: var(--ink); } .rail li.cur::after { content: ""; position: absolute; left: -19px; top: calc(50% - 4px); width: 7px; height: 7px; background: var(--ink); border-radius: 50%; }
.rail li button:hover { color: var(--ink); }
.pm { min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 18px 0 14px; }
.pm .view { position: relative; flex: 1; min-height: 0; background: var(--soft); border: 1px solid var(--line); view-transition-name: piece-img; }
.pm .view img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
.pm .view model-viewer { position: absolute; inset: 0; width: 100%; height: 100%; --poster-color: transparent; }
.pm .view .ph { position: absolute; inset: 0; }
.mt { display: flex; gap: 6px; flex-wrap: wrap; }
.mt button { font: 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--line2); background: none; padding: 5px 9px; }
.mt button.on, .mt button:hover { background: var(--ink); color: var(--bg); }
.pd { overflow: auto; padding: 18px 0 40px; min-width: 0; }
.pd > * { animation: labIn .7s var(--ease) .45s both; }
.pd > :nth-child(3) { animation-delay: .55s; } .pd > :nth-child(4) { animation-delay: .65s; } .pd > :nth-child(5) { animation-delay: .75s; } .pd > :nth-child(n+6) { animation-delay: .85s; }
.pd .ref { font: 10px var(--mono); letter-spacing: .14em; color: var(--mute); text-transform: uppercase; }
.pd h2 { font-weight: 300; font-size: clamp(24px, 2.6vw, 36px); line-height: 1.05; margin: 6px 0 4px; text-transform: uppercase; }
.sec { display: flex; gap: 10px; margin: 26px 0 9px; font: 10px var(--mono); letter-spacing: .14em; color: var(--mute); text-transform: uppercase; }
.sec b { color: var(--ink); font-weight: 400; }
.kv { display: grid; grid-template-columns: 128px 1fr; font: 11px/1.4 var(--mono); letter-spacing: .04em; text-transform: uppercase; border-top: 1px solid var(--line); }
.kv > * { padding: 6px 0; border-bottom: 1px solid var(--line); }
.kv .k { color: var(--mute); }
.tbd { display: inline-block; border: 1px dashed var(--mute); color: var(--mute); padding: 0 6px; font-size: 9.5px; letter-spacing: .14em; }
.story { font-size: 15px; line-height: 1.7; white-space: pre-wrap; margin: 0 0 10px; }
.story.cm { color: var(--mute); font-size: 14px; }
.ps { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.ps button { flex: none; width: 78px; background: none; border: 0; padding: 0; text-align: left; }
.ps img { width: 78px; height: 104px; object-fit: cover; display: block; border: 1px solid var(--line2); }
.ps span { display: block; margin-top: 4px; font: 9px/1.35 var(--mono); color: var(--mute); text-transform: uppercase; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
.pl { font: 10px var(--mono); letter-spacing: .12em; color: var(--mute); text-transform: uppercase; margin: 8px 0; }
.rel { width: 100%; display: grid; grid-template-columns: 62px 1fr; gap: 14px; background: none; border: 1px solid var(--line); padding: 10px; text-align: left; margin-bottom: 8px; }
.rel:hover { border-color: var(--ink); }
.rel .th { aspect-ratio: 3 / 4; background: var(--soft); border: 1px solid var(--line2); overflow: hidden; display: grid; place-items: center; }
.rel .th img { width: 100%; height: 100%; object-fit: cover; }
.rel .nm { font-size: 14px; text-transform: uppercase; margin: 2px 0 4px; }
.rel p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--mute); }
.loc { border: 1px solid var(--line); padding: 10px; }
.loc svg { display: block; width: 100%; height: 150px; }
.loc .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font: 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.pn { display: none; }

/* ---------- Karte ---------- */
#map { position: fixed; inset: 0; z-index: 60; display: none; background: var(--bg); }
#map.on { display: block; }
#map .mh { position: absolute; z-index: 2; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: max(10px, env(safe-area-inset-top)) 28px 10px; font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; background: var(--bg); border-bottom: 1px solid var(--line); }
#mapc { position: absolute; inset: 0; }
.mk { min-width: 34px; height: 34px; padding: 0 4px; border-radius: 17px; border: 1px solid var(--ink); background: var(--bg); color: var(--ink); font: 9px var(--mono); display: grid; place-items: center; }
.mk.cur { background: var(--ink); color: var(--bg); } .mk.org { box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px var(--ink); }
#lb { position: fixed; inset: 0; z-index: 70; display: none; place-items: center; background: color-mix(in srgb, var(--bg) 94%, transparent); }
#lb.on { display: grid; } #lb img { max-width: 94vw; max-height: 92dvh; }
#lb button { position: absolute; top: max(12px, env(safe-area-inset-top)); right: 16px; width: 44px; height: 44px; border: 1px solid var(--line2); background: var(--bg); font-size: 22px; }

/* ---------- Handy ---------- */
@media (max-width: 860px) {
  .bar { padding: max(10px, env(safe-area-inset-top)) 16px 10px; gap: 10px; flex-wrap: wrap; }
  .bar .word { flex: 1; font-size: 11px; letter-spacing: .16em; }
  .crumbs { order: 3; flex: 1 1 0; } .bar .tid { order: 4; } .bar .tool { order: 2; }
  .bar .tid input { width: 104px; font-size: 16px; }
  .hud { display: none; }
  .index { padding: 0 16px 30px; } .tiles { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 24px 14px; }
  .ti { flex-direction: column; gap: 2px; } .ti .meta { text-align: left; }
  .lx { padding: 0 16px 10px; }
  .lh { flex-direction: column; align-items: flex-start; gap: 8px; padding-top: 10px; } .lh .right { align-items: flex-start; }
  .hero-wrap, .hero { height: 78%; }
  .enter { bottom: 6px; } .hint1, .legend { display: none; }
  .cn { width: 68px; } .nd { width: 54px; }
  .nlab .nm { font-size: 10px; max-width: 11ch; } .nlab .ref { font-size: 8.5px; }
  .piece { display: block; height: 100%; overflow: auto; padding: 0 16px 84px; }
  .rail { display: none; }
  .pm { padding-top: 14px; } .pm .view { aspect-ratio: 4 / 5; flex: none; }
  .pd { overflow: visible; } .kv { grid-template-columns: 112px 1fr; }
  .pn { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; border-top: 1px solid var(--line2); background: var(--bg); padding-bottom: env(safe-area-inset-bottom); }
  .pn button { flex: 1; min-height: 52px; background: none; border: 0; font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
  .pn button + button { border-left: 1px solid var(--line); } .pn button:disabled { opacity: .25; }
  #map .mh { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01s !important; animation-delay: 0s !important; } }
</style>
</head>
<body>
<header class="bar">
  <a class="word" href="#/">CUTTING FROM MEMORY</a>
  <nav class="crumbs" id="crumbs"></nav>
  <form class="tid" id="tid" autocomplete="off"><input id="tidIn" placeholder="TRACE-ID" inputmode="decimal" aria-label="Trace-ID"><button type="submit">→</button></form>
  <button class="tool" id="mapBtn">Map</button>
  <button class="tool" id="themeBtn" aria-label="Theme">◐</button>
</header>
<main id="stage"></main>
<footer class="hud"><span id="hudL"></span><span id="hudR"></span></footer>
<div id="map"><div class="mh"><span id="mapT">Map</span><button class="btn" id="mapX">Close ✕</button></div><div id="mapc"></div></div>
<div id="lb"><button aria-label="Close">×</button><img alt=""></div>

<script>
const MAPBOX_TOKEN = "pk.eyJ1IjoibGVvbnJvY2EiLCJhIjoiY21wYmY1Yjl6MDNxczJxc2U0MzByNHA3OCJ9.-BaGJWtZCr3lKDKP1o9THQ";
const MAP_STYLE = "mapbox://styles/leonroca/cmu5b7jcz003g01sagg39fgfx";
const S = { looks: [], level: -1, look: null, piece: null, focusLook: null, focusPiece: null, back: false };
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; };
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pad = n => String(n).padStart(2, "0");
const TYPE = { commission: "Origin", lost_and_found: "Found", scan: "Scan" };
const CUBE = '<svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="currentColor" stroke-width="1"><path d="M13 3l9 5v10l-9 5-9-5V8z"/><path d="M4 8l9 5 9-5M13 13v10"/></svg>';
const TBD = '<span class="tbd">TBD</span>';
const vt = (e, name) => { if (e) e.style.viewTransitionName = name; return e; };

/* ---------- Routing ---------- */

  if (!MAP) MAP = new mapboxgl.Map({ container: "mapc", style: MAP_STYLE, center: [8.54, 47.377], zoom: 12 });
  MARKERS.forEach(m => m.remove()); MARKERS = []; const b = new mapboxgl.LngLatBounds();
  set.forEach(l => l.points.forEach(p => { const d = el("button", "mk" + (p === cur ? " cur" : "") + (p.category === "commission" ? " org" : ""), all ? l.n + "." + (p.idx + 1) : "P" + pad(p.idx + 1)); d.onclick = () => go("#/look/" + l.n + "/p/" + (p.idx + 1));
    MARKERS.push(new mapboxgl.Marker({ element: d }).setLngLat([p.lng, p.lat]).addTo(MAP)); b.extend([p.lng, p.lat]); }));
  MAP.resize(); if (!b.isEmpty()) MAP.fitBounds(b, { padding: { top: 110, bottom: 70, left: 60, right: 60 }, maxZoom: 16, duration: 0 });
}
function closeMap() { $("#map").classList.remove("on"); }
function lightbox(u) { $("#lb img").src = u; $("#lb").classList.add("on"); }

/* ---------- Bedienung ---------- */
$("#mapBtn").onclick = () => openMap(); $("#mapX").onclick = closeMap; $("#lb").onclick = () => $("#lb").classList.remove("on");
$("#themeBtn").onclick = () => { const d = document.documentElement, t = d.dataset.theme === "dark" ? "light" : "dark"; d.dataset.theme = t; try { localStorage.setItem("cfm-theme", t); } catch (e) {} };
$("#tid").onsubmit = e => {
  e.preventDefault(); const n = ($("#tidIn").value.match(/-?\d{1,3}(?:[.,]\d+)?/g) || []).map(x => +x.replace(",", ".")); if (n.length < 2) return; let hit = null;
  S.looks.forEach(l => l.points.forEach(p => { if (!hit && ((Math.abs(p.lat - n[0]) < .0003 && Math.abs(p.lng - n[1]) < .0003) || (Math.abs(p.lat - n[1]) < .0003 && Math.abs(p.lng - n[0]) < .0003))) hit = p; }));
  if (hit) go("#/look/" + hit.look.n + "/p/" + (hit.idx + 1)); else { $("#tidIn").value = ""; $("#tidIn").placeholder = "NOT FOUND"; }
};
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return; const r = parse(), look = S.looks[r.l - 1];
  if (e.key === "Escape") { if ($("#lb").classList.contains("on")) $("#lb").classList.remove("on"); else if ($("#map").classList.contains("on")) closeMap(); else if (r.level === 3) go("#/look/" + r.l + "/net"); else if (r.level === 2) go("#/look/" + r.l); else if (r.level === 1) go("#/"); }
  if (!look) return; const step = d => { if (r.level === 3) { const q = look.points[r.p - 1 + d]; if (q) go("#/look/" + r.l + "/p/" + (q.idx + 1)); } else { const o = S.looks[r.l - 1 + d]; if (o) go("#/look/" + o.n + (r.level === 2 ? "/net" : "")); } };
  if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1);
  if (e.key === "Enter" && r.level === 1) go("#/look/" + r.l + "/net");
});
addEventListener("hashchange", route);
load().then(route).catch(e => { console.error(e); $("#stage").innerHTML = '<p style="padding:40px;font:11px monospace">COULD NOT LOAD DATA</p>'; });
</script>
