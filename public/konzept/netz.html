<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Concept — Neural look network</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<script>
  (function () {
    try {
      var q = new URLSearchParams(location.search).get("t"), saved = localStorage.getItem("cfm-theme");
      var t = q || saved || "dark"; if (q) localStorage.setItem("cfm-theme", q);
      document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
    } catch (e) {}
  })();
</script>
<style>
:root {
  --bg: #fafaf8; --ink: #0a0a0a; --mute: #7d7d7a; --line: rgba(10,10,10,.15); --line2: rgba(10,10,10,.6); --soft: #efefec; --dot: rgba(10,10,10,.1); --glow: rgba(10,10,10,.0);
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --sans: "Helvetica Neue Light", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --ease: cubic-bezier(.2,.7,.2,1); --T: 1.15s;
}
[data-theme="dark"] { --bg: #07080a; --ink: #ecece9; --mute: #86878b; --line: rgba(236,236,233,.13); --line2: rgba(236,236,233,.5); --soft: #121316; --dot: rgba(236,236,233,.1); --glow: rgba(236,236,233,.55); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 300; display: grid; grid-template-rows: auto 1fr auto; height: 100dvh; overflow: hidden; -webkit-tap-highlight-color: transparent; transition: background .35s, color .35s; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
.bar { display: flex; align-items: center; gap: 14px; padding: max(10px, env(safe-area-inset-top)) 28px 10px; border-bottom: 1px solid var(--line); font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.bar a, .bar button { color: inherit; text-decoration: none; background: none; border: 0; padding: 6px 0; letter-spacing: inherit; text-transform: inherit; font: inherit; }
.bar .word { font-family: var(--sans); font-size: 12px; letter-spacing: .26em; white-space: nowrap; }
.crumbs { flex: 1; color: var(--mute); display: flex; gap: 8px; white-space: nowrap; overflow: hidden; min-width: 0; }
.crumbs a:hover { color: var(--ink); } .crumbs .cur { color: var(--ink); }
.bar .tid { display: flex; align-items: center; border: 1px solid var(--line2); }
.bar .tid input { width: 150px; background: none; border: 0; padding: 6px 8px; outline: none; font: inherit; letter-spacing: .06em; }
.bar .tid button { padding: 6px 9px; border-left: 1px solid var(--line2); }
.bar .tool { border: 1px solid var(--line2); padding: 6px 10px; }
.bar .tool:hover, .bar .tid button:hover { background: var(--ink); color: var(--bg); }
#stage { min-height: 0; overflow: hidden; position: relative; background-image: radial-gradient(var(--dot) 1px, transparent 1.3px); background-size: 28px 28px; background-position: 14px 14px; }
.hud { display: flex; justify-content: space-between; gap: 20px; padding: 8px 28px max(8px, env(safe-area-inset-bottom)); border-top: 1px solid var(--line); font: 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); min-height: 33px; }
.hud b { color: var(--ink); font-weight: 400; }
.first { animation: viewIn .8s var(--ease) both; }
@keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
::view-transition-group(*) { animation-duration: .8s; animation-timing-function: var(--ease); }
::view-transition-old(look-img), ::view-transition-new(look-img) { height: 100%; object-fit: cover; }
.code { font: 10px var(--mono); letter-spacing: .14em; color: var(--mute); text-transform: uppercase; }
.meta { font: 10px/1.7 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.ph { display: grid; place-items: center; text-align: center; font: 9px/1.8 var(--mono); letter-spacing: .12em; color: var(--mute); }
.ph svg { display: block; margin: 0 auto 4px; }
.btn { border: 1px solid var(--line2); background: var(--bg); padding: 8px 13px; font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; }
.btn:hover, .btn.on { background: var(--ink); color: var(--bg); }

/* ---------- Index ---------- */
.index { height: 100%; overflow: auto; padding: 0 28px 30px; }
.ih { padding: 20px 0 18px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
.ih h1 { margin: 4px 0 0; font-weight: 300; font-size: clamp(30px, 4vw, 56px); line-height: 1; text-transform: uppercase; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(clamp(190px, 21vw, 300px), 1fr)); gap: 34px 26px; }
.tile { background: none; border: 0; padding: 0; text-align: left; display: block; }
.timg { position: relative; aspect-ratio: 3 / 4; background: var(--soft); overflow: hidden; border: 1px solid var(--line); }
.timg img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s var(--ease); }
.tile:hover .timg img { transform: scale(1.035); } .tile:hover .timg { border-color: var(--ink); }
.ti { padding-top: 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.ti h2 { margin: 3px 0 0; font-weight: 300; font-size: clamp(15px, 1.5vw, 20px); text-transform: uppercase; }
.ti .meta { text-align: right; flex: none; }

/* ---------- Szene: drei Ebenen hintereinander ---------- */
.scene { height: 100%; display: flex; flex-direction: column; padding: 0 28px 12px; position: relative; }
.lh { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; padding: 14px 0 10px; position: relative; z-index: 8; }
.lh h1 { margin: 4px 0 0; font-weight: 300; font-size: clamp(24px, 3vw, 42px); line-height: 1; text-transform: uppercase; }
.lh .right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.switch { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.switch button { font: 10px var(--mono); border: 1px solid var(--line2); background: none; padding: 5px 9px; letter-spacing: .1em; }
.switch button.on, .switch button:hover { background: var(--ink); color: var(--bg); }
.steps { display: flex; gap: 4px; }
.steps button { font: 9.5px var(--mono); letter-spacing: .12em; text-transform: uppercase; border: 1px solid var(--line); background: none; padding: 5px 9px; color: var(--mute); }
.steps button.on { border-color: var(--ink); color: var(--ink); }
.steps button:hover { color: var(--ink); }
.net { position: relative; flex: 1; min-height: 0; display: grid; grid-template: minmax(0,1fr) / minmax(0,1fr); place-items: center; }
.world { position: absolute; inset: 0; display: grid; grid-template: minmax(0,1fr) / minmax(0,1fr); place-items: center; transition: transform var(--T) var(--ease); transform-origin: 50% 50%; }
.rings { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .9; transition: opacity var(--T); }
.rings ellipse { fill: none; stroke: var(--line); stroke-width: 1; vector-effect: non-scaling-stroke; }

/* Ebene 1: Look-Foto, 100 % scharf */
.hero-wrap { position: relative; z-index: 2; height: 84%; aspect-ratio: 3 / 4; transition: transform var(--T) var(--ease), opacity var(--T), filter var(--T); }
.hero { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; background: var(--soft); view-transition-name: look-img; overflow: hidden; }
.hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-wrap i { position: absolute; width: 16px; height: 16px; border: 0 solid var(--ink); pointer-events: none; transition: opacity .5s; }
.hero-wrap i:nth-of-type(1) { left: -7px; top: -7px; border-width: 1px 0 0 1px; } .hero-wrap i:nth-of-type(2) { right: -7px; top: -7px; border-width: 1px 1px 0 0; }
.hero-wrap i:nth-of-type(3) { left: -7px; bottom: -7px; border-width: 0 0 1px 1px; } .hero-wrap i:nth-of-type(4) { right: -7px; bottom: -7px; border-width: 0 1px 1px 0; }
.clabel { position: absolute; z-index: 4; left: 50%; top: calc(50% + 9vh); transform: translateX(-50%); opacity: 0; transition: opacity .6s; pointer-events: none; text-align: center; }

/* Hotspots (Klickboxen) auf dem Foto */
.hs { position: absolute; z-index: 5; width: 46px; height: 46px; margin: -23px 0 0 -23px; padding: 0; border: 0; background: none; border-radius: 50%; touch-action: none; }
.hs::before { content: ""; position: absolute; inset: 14px; border-radius: 50%; border: 1px solid #fff; background: rgba(255,255,255,.18); mix-blend-mode: difference; animation: pulse 3.2s ease-in-out infinite; }
.hs::after { content: ""; position: absolute; inset: -34px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 62%); opacity: 0; transition: opacity .35s; mix-blend-mode: soft-light; pointer-events: none; }
.hs.on::after { opacity: 1; } .hs.on::before { background: #fff; transform: scale(1.35); }
.hs.org::before { background: rgba(255,255,255,.9); }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); } 50% { box-shadow: 0 0 0 7px rgba(255,255,255,.22); } }
.hs .tip { position: absolute; left: 50%; top: calc(100% - 4px); transform: translateX(-50%); white-space: nowrap; font: 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: #fff; background: rgba(0,0,0,.6); padding: 3px 7px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.hs.on .tip { opacity: 1; }
.edit .hs { cursor: grab; outline: 1px dashed rgba(255,255,255,.7); } .edit .hs:active { cursor: grabbing; }
.edit .hs .tip { opacity: 1; }

/* Stränge */
.strands { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 3; }
.strands path { fill: none; stroke-linecap: round; }
.strands .base { stroke: var(--line2); stroke-width: 1; opacity: .38; transition: opacity var(--T), stroke .3s, stroke-width .3s; }
.strands .pulse { stroke: var(--ink); stroke-width: 2.2; stroke-dasharray: 2 20; opacity: 0; filter: drop-shadow(0 0 4px var(--glow)); transition: opacity .3s; animation: flow 1s linear infinite; }
.strands .lnk { stroke: var(--line2); stroke-width: 1; stroke-dasharray: 3 4; opacity: 0; transition: opacity var(--T); }
@keyframes flow { to { stroke-dashoffset: -22; } }
.strands g.on .base { opacity: 1; stroke: var(--ink); stroke-width: 1.6; filter: drop-shadow(0 0 5px var(--glow)); } .strands g.on .pulse { opacity: 1; }
.strands.dimmed g:not(.on) .base { opacity: .1; }

/* Ebene 2: Piece-Knoten */
.z2 { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
.nd { position: absolute; left: var(--x); top: var(--y); width: clamp(60px, 8vw, 108px); transform: translate(-50%, -50%) scale(.94); background: none; border: 0; padding: 0; text-align: center; pointer-events: auto; opacity: .42; filter: blur(2.6px);
  transition: left var(--T) var(--ease), top var(--T) var(--ease), opacity var(--T), filter var(--T), transform var(--T) var(--ease); }
.nth { aspect-ratio: 3 / 4; background: var(--soft); border: 1px solid var(--line2); overflow: hidden; display: grid; place-items: center; outline: 1px solid transparent; outline-offset: 3px; transition: outline-color .25s; position: relative; z-index: 2; }
.nth img { width: 100%; height: 100%; object-fit: cover; display: block; }
.nd.org .nth { border-color: var(--ink); outline: 1px solid var(--ink); }
.nlab { margin-top: 8px; position: relative; z-index: 2; }
.nlab .ref { font: 9.5px var(--mono); letter-spacing: .1em; color: var(--mute); }
.nlab .nm { font-size: clamp(11px, 1.05vw, 14px); text-transform: uppercase; letter-spacing: .03em; line-height: 1.2; margin: 2px auto 0; max-width: 16ch; }
.tag { display: inline-block; border: 1px solid var(--ink); padding: 0 4px; margin-left: 5px; font: 8.5px var(--mono); letter-spacing: .12em; color: var(--ink); vertical-align: 1px; }
.nd.on .nth, .nd.sel .nth { outline-color: var(--ink); box-shadow: 0 0 24px -4px var(--glow); }
.sats { position: absolute; left: 0; right: 0; top: 0; aspect-ratio: 3 / 4; pointer-events: none; opacity: 0; filter: blur(3px); transition: opacity var(--T), filter var(--T); }
.sats svg { position: absolute; left: 50%; top: 50%; width: 1px; height: 1px; overflow: visible; }
.sats line { stroke: var(--line2); stroke-width: 1; }
.sat { position: absolute; left: calc(50% + var(--dx)); top: calc(50% + var(--dy)); width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 1px solid var(--line2); background: var(--bg); padding: 0; pointer-events: auto; font: 7.5px var(--mono); letter-spacing: .04em; color: var(--mute); display: grid; place-items: center; }
.sat:hover { border-color: var(--ink); color: var(--ink); }
.nd .tip2 { display: none; }
.centerlbl { position: absolute; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, 0); margin-top: clamp(52px, 9.5vh, 96px); opacity: 0; transition: opacity .6s; pointer-events: none; text-align: center; }

/* Kamerastellungen: 0 = Look, 1 = Netzwerk, 2 = Piece */
[data-cam="0"] .nd { --x: var(--x0); --y: var(--y0); }
[data-cam="1"] .nd, [data-cam="2"] .nd { --x: var(--x1); --y: var(--y1); }
[data-cam="1"] .nd { opacity: 1; filter: none; transform: translate(-50%, -50%) scale(1); }
[data-cam="2"] .nd { opacity: .4; filter: blur(2.2px); transform: translate(-50%, -50%) scale(.96); }
[data-cam="2"] .nd.sel { opacity: 1; filter: none; transform: translate(-50%, -50%) scale(1.04); }
[data-cam="0"] .nd.on { opacity: 1; filter: none; transform: translate(-50%, -50%) scale(1.05); }
[data-cam="1"] .sats { opacity: .5; filter: blur(1.6px); } [data-cam="1"] .nd:hover .sats, [data-cam="1"] .nd.on .sats { opacity: 1; filter: none; }
[data-cam="2"] .nd.sel .sats { opacity: .95; filter: none; }
[data-cam="1"] .hero-wrap { transform: scale(.21); }
[data-cam="1"] .hs, [data-cam="2"] .hs { pointer-events: none; }
[data-cam="1"] .hero-wrap i, [data-cam="2"] .hero-wrap i { opacity: 0; }
[data-cam="2"] .hero-wrap { transform: scale(.17); opacity: .5; filter: blur(1.5px); }
[data-cam="1"] .centerlbl { opacity: 1; }
[data-cam="1"] .strands .base { opacity: .7; } [data-cam="2"] .strands .base { opacity: .22; } [data-cam="2"] .strands g.sel .base { opacity: .95; stroke: var(--ink); }
[data-cam="1"] .strands .lnk { opacity: .8; }
[data-cam="2"] .world { transform: translateX(-21%) scale(.66); }
[data-cam="1"] .rings, [data-cam="2"] .rings { opacity: 1; } [data-cam="0"] .rings { opacity: .55; }
.scene.snap, .scene.snap * { transition: none !important; }

/* Hinweise */
.cap { position: absolute; z-index: 9; font: 9.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.cap.l { left: 0; bottom: 4px; } .cap.r { right: 0; bottom: 4px; display: flex; gap: 8px; }
.cap button { border: 1px solid var(--line2); background: var(--bg); padding: 6px 10px; font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink); }
.cap button:hover, .cap button.on { background: var(--ink); color: var(--bg); }
.cap .hint { align-self: center; color: var(--mute); }

/* Detail-Panel: Ebene 3, vor dem verschwommenen Netz */
.panel { position: absolute; z-index: 7; top: 0; bottom: 0; right: 0; width: min(57%, 780px); overflow: auto; padding: 16px 26px 40px; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-left: 1px solid var(--line);
  opacity: 0; transform: translateX(7%); filter: blur(10px); pointer-events: none; transition: opacity var(--T) var(--ease), transform var(--T) var(--ease), filter var(--T) var(--ease); }
[data-cam="2"] .panel { opacity: 1; transform: none; filter: none; pointer-events: auto; }
.pback { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.pview { position: relative; aspect-ratio: 4 / 3; max-height: 44vh; width: 100%; background: var(--soft); border: 1px solid var(--line); }
.pview img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; cursor: zoom-in; }
.pview model-viewer { position: absolute; inset: 0; width: 100%; height: 100%; --poster-color: transparent; }
.pview .ph { position: absolute; inset: 0; }
.mt { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 0; }
.mt button { font: 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--line2); background: none; padding: 5px 9px; }
.mt button.on, .mt button:hover { background: var(--ink); color: var(--bg); }
.panel .ref { font: 10px var(--mono); letter-spacing: .14em; color: var(--mute); text-transform: uppercase; margin-top: 16px; }
.panel h2 { font-weight: 300; font-size: clamp(24px, 2.6vw, 36px); line-height: 1.05; margin: 6px 0 4px; text-transform: uppercase; }
.sec { display: flex; gap: 10px; margin: 26px 0 9px; font: 10px var(--mono); letter-spacing: .14em; color: var(--mute); text-transform: uppercase; }
.sec b { color: var(--ink); font-weight: 400; }
.kv { display: grid; grid-template-columns: 128px 1fr; font: 11px/1.4 var(--mono); letter-spacing: .04em; text-transform: uppercase; border-top: 1px solid var(--line); }
.kv > * { padding: 6px 0; border-bottom: 1px solid var(--line); } .kv .k { color: var(--mute); }
.tbd { display: inline-block; border: 1px dashed var(--mute); color: var(--mute); padding: 0 6px; font-size: 9.5px; letter-spacing: .14em; }
.story { font-size: 15px; line-height: 1.7; white-space: pre-wrap; margin: 0 0 10px; } .story.cm { color: var(--mute); font-size: 14px; }
.ps { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.ps button { flex: none; width: 78px; background: none; border: 0; padding: 0; text-align: left; }
.ps img { width: 78px; height: 104px; object-fit: cover; display: block; border: 1px solid var(--line2); }
.ps span { display: block; margin-top: 4px; font: 9px/1.35 var(--mono); color: var(--mute); text-transform: uppercase; max-width: 78px; overflow: hidden; text-overflow: ellipsis; }
.pl { font: 10px var(--mono); letter-spacing: .12em; color: var(--mute); text-transform: uppercase; margin: 8px 0; }
.rel { width: 100%; display: grid; grid-template-columns: 62px 1fr; gap: 14px; background: none; border: 1px solid var(--line); padding: 10px; text-align: left; margin-bottom: 8px; }
.rel:hover { border-color: var(--ink); }
.rel .th { aspect-ratio: 3 / 4; background: var(--soft); border: 1px solid var(--line2); overflow: hidden; display: grid; place-items: center; } .rel .th img { width: 100%; height: 100%; object-fit: cover; }
.rel .nm { font-size: 14px; text-transform: uppercase; margin: 2px 0 4px; } .rel p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--mute); }
.loc { border: 1px solid var(--line); padding: 10px; } .loc svg { display: block; width: 100%; height: 150px; }
.loc .row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font: 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--mute); }
.panel > .blk { animation: labIn .7s var(--ease) both; } @keyframes labIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

#map { position: fixed; inset: 0; z-index: 60; display: none; background: var(--bg); } #map.on { display: block; }
#map .mh { position: absolute; z-index: 2; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: max(10px, env(safe-area-inset-top)) 28px 10px; font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; background: var(--bg); border-bottom: 1px solid var(--line); }
#mapc { position: absolute; inset: 0; }
.mk { min-width: 34px; height: 34px; padding: 0 4px; border-radius: 17px; border: 1px solid var(--ink); background: var(--bg); color: var(--ink); font: 9px var(--mono); display: grid; place-items: center; }
.mk.cur { background: var(--ink); color: var(--bg); } .mk.org { box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px var(--ink); }
#lb { position: fixed; inset: 0; z-index: 70; display: none; place-items: center; background: color-mix(in srgb, var(--bg) 94%, transparent); } #lb.on { display: grid; } #lb img { max-width: 94vw; max-height: 92dvh; }
#lb button { position: absolute; top: max(12px, env(safe-area-inset-top)); right: 16px; width: 44px; height: 44px; border: 1px solid var(--line2); background: var(--bg); font-size: 22px; }

@media (max-width: 860px) {
  .bar { padding: max(10px, env(safe-area-inset-top)) 16px 10px; gap: 10px; flex-wrap: wrap; }
  .bar .word { flex: 1; font-size: 11px; letter-spacing: .16em; } .crumbs { display: none; } .bar .tid { order: 4; } .bar .tool { order: 2; } .bar .tid input { width: 104px; font-size: 16px; }
  .hud { display: none; }
  .index { padding: 0 16px 30px; } .tiles { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 24px 14px; } .ti { flex-direction: column; gap: 2px; } .ti .meta { text-align: left; }
  .scene { padding: 0 16px 10px; } .lh { flex-direction: column; align-items: flex-start; gap: 8px; padding-top: 10px; } .lh .right { align-items: flex-start; }
  .hero-wrap { height: 62%; } .hs { width: 44px; height: 44px; }
  .nd { width: 54px; } .nlab .nm { font-size: 10px; max-width: 11ch; } .nlab .ref { font-size: 8.5px; } .sat { width: 18px; height: 18px; margin: -9px 0 0 -9px; font-size: 6.5px; }
  .cap.l { display: none; } .cap.r { right: 0; } .cap .hint { display: none; }
  [data-cam="2"] .world { transform: translateY(-31%) scale(.5); }
  .panel { top: 36%; width: 100%; border-left: 0; border-top: 1px solid var(--line2); padding: 12px 16px 40px; }
  .pview { max-height: 34vh; }
  .kv { grid-template-columns: 112px 1fr; }
  #map .mh { padding-left: 16px; padding-right: 16px; }

  const show = i => { view.innerHTML = ""; const m = media[i]; [...mt.children].forEach((b, k) => b.classList.toggle("on", k === i));
    if (!m) { view.innerHTML = '<div class="ph"><div>' + CUBE + "NO MEDIA YET — TBD</div></div>"; return; }
    if (m.kind === "image") { const im = el("img"); im.src = m.url; im.alt = ""; im.onclick = () => lightbox(m.url); view.append(im); }
    else if (m.kind === "video") { const v = el("video"); v.src = m.url; v.controls = true; v.playsInline = true; Object.assign(v.style, { position: "absolute", inset: 0, width: "100%", height: "100%" }); view.append(v); }
    else { const mv = document.createElement("model-viewer"); mv.setAttribute("src", m.url); mv.setAttribute("camera-controls", ""); mv.setAttribute("auto-rotate", ""); mv.setAttribute("touch-action", "pan-y"); view.append(mv); } };
  let ic = 0, iv = 0; media.forEach((m, i) => { const b = el("button", "", m.kind === "image" ? "IMG " + (++ic) : m.kind === "video" ? "VID " + (++iv) : "3D SCAN"); b.onclick = () => show(i); mt.append(b); }); show(0);
  const mw = el("div", "blk"); mw.append(view); if (media.length > 1) mw.append(mt); panel.append(mw);
  blk('<div class="ref">' + p.ref + " · " + TYPE[p.category] + "</div><h2>" + esc(p.name) + "</h2>");
  const val = v => (v && String(v).trim()) ? esc(v) : TBD;
  const kv = [["Ref", p.ref], ["Type", TYPE[p.category] + (p.category === "commission" ? " (start of trace)" : "")], ["Trace-ID", coord(p)], ["From origin", p.km != null ? p.km.toFixed(2) + " km" : "—"], ["Media", [p.nImg && "IMG " + p.nImg, p.nModel && "3D " + p.nModel, p.nAudio && "AUDIO " + p.nAudio].filter(Boolean).join(" · ") || TBD], ["Process", ((p.raw || []).length || (p.chg || []).length) ? "RAW " + (p.raw || []).length + " → CHANGE " + (p.chg || []).length : TBD], ["Material", val(p.material)], ["Composition", val(p.composition)], ["Condition", val(p.condition)], ["Found on", val(p.found_on)], ["Status", val(p.status)]];
  blk('<div class="sec"><b>01</b> Specification</div><div class="kv">' + kv.map(r => '<div class="k">' + r[0] + "</div><div>" + r[1] + "</div>").join("") + "</div>").dataset.s = "spec";
  const story = (p.text || "").trim(), cm = (p.item_comment || "").trim();
  if (story || cm) blk('<div class="sec"><b>02</b> Story</div>' + (story ? '<p class="story">' + esc(story) + "</p>" : "") + (cm ? '<p class="story cm">' + esc(cm) + "</p>" : ""));
  p.media.filter(m => m.kind === "audio").forEach(m => blk('<audio controls preload="none" src="' + esc(m.url) + '" style="width:100%"></audio>'));
  if ((p.raw || []).length || (p.chg || []).length) { const strip = (t, arr) => arr.length ? '<div class="pl">' + t + '</div><div class="ps">' + arr.map(e => '<button data-u="' + esc(e.image_url) + '"><img loading="lazy" src="' + esc(e.image_url) + '" alt=""><span>' + esc(e.caption || "—") + "</span></button>").join("") + "</div>" : "";
    const b = blk('<div class="sec"><b>03</b> Process</div>' + strip("Unprocessed ↓", p.raw || []) + strip("Changes ↓", p.chg || [])); b.dataset.s = "process"; b.querySelectorAll("button[data-u]").forEach(x => x.onclick = () => lightbox(x.dataset.u)); }
  if (p.links.length) { const b = blk('<div class="sec"><b>04</b> Related</div>'); p.links.forEach(l => { const o = look.points.find(x => x.id === l.point_id); if (!o) return; const r = el("button", "rel"), th = el("div", "th"); th.append(thumb(o)); const t = el("div"); t.innerHTML = '<div class="pl" style="margin:0">⇄ ' + o.ref + " · " + TYPE[o.category] + '</div><div class="nm">' + esc(o.name) + "</div><p>" + esc(l.note || "") + "</p>"; r.append(th, t); r.onclick = () => go("#/look/" + look.n + "/p/" + (o.idx + 1)); b.append(r); }); }
  const lb = blk(locatorHtml(look, p)); lb.dataset.s = "loc"; $("button", lb).onclick = () => openMap(look, p);
  panel.scrollTop = 0;
  if (W.sec) { const t = panel.querySelector('[data-s="' + W.sec + '"]'); W.sec = null; if (t) setTimeout(() => t.scrollIntoView({ behavior: "smooth", block: "start" }), 900); }
}
function locatorHtml(look, p) {
  const pts = look.points, la = pts.map(q => q.lat), ln = pts.map(q => q.lng), mnLa = Math.min(...la), mxLa = Math.max(...la), mnLn = Math.min(...ln), mxLn = Math.max(...ln);
  const Wd = 400, H = 150, pd = 20, sx = q => pd + (q.lng - mnLn) / ((mxLn - mnLn) || 1) * (Wd - 2 * pd), sy = q => H - pd - (q.lat - mnLa) / ((mxLa - mnLa) || 1) * (H - 2 * pd);
  let s = '<svg viewBox="0 0 ' + Wd + " " + H + '" preserveAspectRatio="xMidYMid meet" fill="none" stroke="currentColor" stroke-width="1"><rect x="1" y="1" width="' + (Wd - 2) + '" height="' + (H - 2) + '" opacity=".25"/>';
  if (look.origin) pts.forEach(q => { if (q !== look.origin) s += '<line x1="' + sx(look.origin) + '" y1="' + sy(look.origin) + '" x2="' + sx(q) + '" y2="' + sy(q) + '" opacity=".25" stroke-dasharray="3 4"/>'; });
  pts.forEach(q => { const x = sx(q), y = sy(q), cur = q === p; s += q.category === "commission" ? '<rect x="' + (x - 4) + '" y="' + (y - 4) + '" width="8" height="8" fill="' + (cur ? "currentColor" : "none") + '"/>' : '<circle cx="' + x + '" cy="' + y + '" r="3.2" fill="' + (cur ? "currentColor" : "none") + '"/>'; if (cur) s += '<circle cx="' + x + '" cy="' + y + '" r="11"/>'; });
  return '<div class="sec"><b>05</b> Location</div><div class="loc">' + s + '</svg><div class="row"><span>□ origin · ○ piece</span><button class="btn">Open map →</button></div></div>';
}

/* ---------- Karte ---------- */
let MAP = null, MARKERS = [];
const loadMapbox = () => window.mapboxgl ? Promise.resolve() : new Promise((ok, no) => { const s = el("script"); s.src = "https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"; s.onload = ok; s.onerror = no; document.head.append(s); });
async function openMap(look, cur) {
  const all = !look && S.level < 0; look = look || S.look; const set = all ? S.looks : [look];
  $("#map").classList.add("on"); $("#mapT").textContent = all ? "Map — all looks" : "Map — " + look.code + " / " + pad(look.n);
  await loadMapbox(); mapboxgl.accessToken = MAPBOX_TOKEN; if (!MAP) MAP = new mapboxgl.Map({ container: "mapc", style: MAP_STYLE, center: [8.54, 47.377], zoom: 12 });
  MARKERS.forEach(m => m.remove()); MARKERS = []; const b = new mapboxgl.LngLatBounds();
  set.forEach(l => l.points.forEach(p => { const d = el("button", "mk" + (p === cur ? " cur" : "") + (p.category === "commission" ? " org" : ""), all ? l.n + "." + (p.idx + 1) : "P" + pad(p.idx + 1)); d.onclick = () => go("#/look/" + l.n + "/p/" + (p.idx + 1)); MARKERS.push(new mapboxgl.Marker({ element: d }).setLngLat([p.lng, p.lat]).addTo(MAP)); b.extend([p.lng, p.lat]); }));
  MAP.resize(); if (!b.isEmpty()) MAP.fitBounds(b, { padding: { top: 110, bottom: 70, left: 60, right: 60 }, maxZoom: 16, duration: 0 });
}
function closeMap() { $("#map").classList.remove("on"); }
function lightbox(u) { $("#lb img").src = u; $("#lb").classList.add("on"); }

/* ---------- Bedienung ---------- */
$("#mapBtn").onclick = () => openMap(); $("#mapX").onclick = closeMap; $("#lb").onclick = () => $("#lb").classList.remove("on");
$("#themeBtn").onclick = () => { const d = document.documentElement, t = d.dataset.theme === "dark" ? "light" : "dark"; d.dataset.theme = t; try { localStorage.setItem("cfm-theme", t); } catch (e) {} };
$("#tid").onsubmit = e => { e.preventDefault(); const n = ($("#tidIn").value.match(/-?\d{1,3}(?:[.,]\d+)?/g) || []).map(x => +x.replace(",", ".")); if (n.length < 2) return; let hit = null;
  S.looks.forEach(l => l.points.forEach(p => { if (!hit && ((Math.abs(p.lat - n[0]) < .0003 && Math.abs(p.lng - n[1]) < .0003) || (Math.abs(p.lat - n[1]) < .0003 && Math.abs(p.lng - n[0]) < .0003))) hit = p; }));
  if (hit) go("#/look/" + hit.look.n + "/p/" + (hit.idx + 1)); else { $("#tidIn").value = ""; $("#tidIn").placeholder = "NOT FOUND"; } };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return; const r = parse(), look = S.looks[r.l - 1];
  if (e.key === "Escape") { if ($("#lb").classList.contains("on")) $("#lb").classList.remove("on"); else if ($("#map").classList.contains("on")) closeMap(); else if (r.cam === 2) go("#/look/" + r.l + "/net"); else if (r.cam === 1) go("#/look/" + r.l); else if (r.cam === 0) go("#/"); }
  if (!look) return; const step = d => { if (r.cam === 2) { const q = look.points[r.p + d]; if (q) go("#/look/" + r.l + "/p/" + (q.idx + 1)); } else { const o = S.looks[r.l - 1 + d]; if (o) go("#/look/" + o.n + (r.cam === 1 ? "/net" : "")); } };
  if (e.key === "ArrowRight") step(1); if (e.key === "ArrowLeft") step(-1); if (e.key === "Enter" && r.cam === 0) go("#/look/" + r.l + "/net");
});
addEventListener("hashchange", route); addEventListener("resize", () => kick(300));
load().then(route).catch(e => { console.error(e); $("#stage").innerHTML = '<p style="padding:40px;font:11px monospace">COULD NOT LOAD DATA</p>'; });
</script>
</body>
