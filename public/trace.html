<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>Cutting from Memory</title>
<script>
  // Theme vor dem ersten Zeichnen setzen (Standard dunkel; ?t=light|dark oder die letzte Wahl).
  try {
    var q = new URLSearchParams(location.search).get("t"), saved = localStorage.getItem("cfm-theme"), t = q || saved || "dark";
    if (q) localStorage.setItem("cfm-theme", q);
    document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
  } catch (e) { document.documentElement.dataset.theme = "dark"; }
</script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/trace.css">
</head>
<body class="trace-page">
<header class="bar">
  <a class="word" href="/">CUTTING FROM MEMORY</a>
  <nav class="crumbs" id="crumbs"></nav>
  <button class="tool" id="mapBtn">Map</button>
  <button class="tool" id="themeBtn" aria-label="Switch theme">◐</button>
</header>
<main id="stage"></main>
<footer class="hud"><span id="hudL"></span><span id="hudR"></span></footer>
<div id="message" class="message">Loading …</div>

<div id="map">
  <div class="mh"><span id="mapT">Map</span><button class="btn" id="mapX">Close ✕</button></div>
  <div id="mapc"></div>
</div>

<div id="lightbox">
  <button id="lightboxClose" aria-label="Close">×</button>
  <img id="lightboxImage" alt="">
</div>

<script src="/js/common.js"></script>
<script src="/js/trace-detail.js"></script>
<script src="/js/trace-map.js"></script>
<script src="/js/trace-scene.js"></script>
<script src="/js/trace-main.js"></script>
</body>
</html>
