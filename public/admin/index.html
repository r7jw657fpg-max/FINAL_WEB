<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
<script src="/shared.js"></script>
<!-- @imgly/background-removal importiert intern "onnxruntime-web" als
     bare specifier — ohne Bundler kann der Browser das nicht auflösen,
     darum hier per Import-Map explizit auf die CDN-Datei zeigen. -->
<script type="importmap">
{
  "imports": {
    "onnxruntime-web": "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.bundle.min.mjs"
  }
}
</script>
<script type="module">
  import { removeBackground } from "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/dist/index.mjs";
  window.imglyRemoveBackground = removeBackground;
</script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: "Helvetica Neue Light", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 300; }
#map { position: absolute; inset: 0; }

.panel {
  position: absolute; z-index: 20; top: 18px;
  max-height: calc(100vh - 36px); overflow-y: auto;
  padding: 22px; background: rgba(12,12,12,.96); color: white;
  border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
  box-shadow: 0 20px 70px rgba(0,0,0,.5);
}
#sidebar { left: 18px; width: 320px; }
#detail { left: 356px; width: 420px; display: none; }
#detail.active { display: block; }

.panel-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 25px; gap: 10px; }
.kicker { font-size: 9px; letter-spacing: .18em; opacity: .45; }
.panel-title { margin-top: 5px; font-size: 22px; font-weight: 400; }
.detail-title { margin: 4px 0 22px; font-size: 20px; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.section { padding-bottom: 22px; margin-bottom: 22px; border-bottom: 1px solid rgba(255,255,255,.1); }
.section:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
.section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; gap: 8px; }
.section-title { font-size: 13px; }
.section-subtitle { margin-top: 3px; font-size: 9px; opacity: .4; }

button { font-family: inherit; cursor: pointer; }
.small-button { padding: 7px 11px; border: 1px solid rgba(255,255,255,.2); border-radius: 4px; background: white; color: black; font-size: 10px; white-space: nowrap; }
.small-button:hover { opacity: .8; }
.small-button:disabled { opacity: .3; cursor: default; }
.icon-button { border: 1px solid rgba(255,255,255,.2); border-radius: 4px; background: transparent; color: white; font-size: 11px; padding: 7px 11px; }
.icon-button:hover { background: rgba(255,255,255,.08); }

/* Trace-Liste (Sidebar) */
.route-list { display: flex; flex-direction: column; gap: 6px; }
.route-card { display: flex; align-items: center; gap: 9px; padding: 10px; border: 1px solid rgba(255,255,255,.12); border-radius: 5px; background: rgba(255,255,255,.03); cursor: pointer; }
.route-card:hover { background: rgba(255,255,255,.07); }
.route-card.selected { background: rgba(255,212,0,.1); border-color: #ffd400; }
.route-color { width: 12px; height: 12px; flex-shrink: 0; border-radius: 50%; }
.route-card-body { flex: 1; overflow: hidden; }
.route-card-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11px; }
.route-card-meta { margin-top: 2px; font-size: 9px; opacity: .45; }
.visibility { border: 0; background: transparent; color: inherit; opacity: .6; cursor: pointer; font-size: 13px; flex-shrink: 0; }

label { display: block; margin-bottom: 13px; font-size: 10px; opacity: .8; }
input[type=text], textarea, select, input[type=number] { display: block; width: 100%; margin-top: 6px; padding: 9px; border: 1px solid rgba(255,255,255,.18); border-radius: 4px; outline: none; background: #1c1c1c; color: white; font-family: inherit; }
textarea { min-height: 60px; resize: vertical; }
input[type=color] { display: block; width: 100%; height: 32px; margin-top: 6px; padding: 2px; border: 0; background: transparent; }
input[type=range] { width: 100%; margin-top: 7px; }
input[type=file] { display: block; width: 100%; font-size: 9px; color: white; margin-top: 6px; }

.field-row { display: flex; gap: 10px; }
.field-row label { flex: 1; }

.actions { display: flex; gap: 6px; }
.actions button { flex: 1; padding: 8px; border: 0; border-radius: 4px; background: white; color: black; font-size: 10px; }
.delete { background: rgba(255,69,58,.15) !important; color: #ff453a !important; }

.hint { padding: 9px; border-radius: 4px; background: rgba(255,255,255,.04); font-size: 10px; line-height: 1.5; opacity: .5; }
.empty-state { padding: 26px 14px; text-align: center; opacity: .4; font-size: 11px; }
#status { font-size: 9px; opacity: .4; margin-top: 4px; }

.entries-box { margin-top: 6px; margin-bottom: 13px; padding: 10px; border: 1px solid rgba(255,255,255,.1); border-radius: 5px; background: rgba(255,255,255,.02); }
.entries-title { font-size: 10px; opacity: .7; margin-bottom: 8px; }
.entry-item { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px solid rgba(255,255,255,.06); }
.entry-item:first-child { border-top: 0; }
.entry-thumb { width: 34px; height: 34px; border-radius: 4px; object-fit: cover; flex-shrink: 0; background: #222; }
.entry-note { flex: 1; font-size: 10px; opacity: .8; white-space: pre-wrap; word-break: break-word; }
.entry-delete { border: 0; background: transparent; color: #ff453a; font-size: 14px; cursor: pointer; flex-shrink: 0; }
.entry-form { margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(255,255,255,.1); }
.entry-form label { margin-bottom: 8px; }
.entry-add-button { width: 100%; margin-top: 4px; padding: 7px; border: 0; border-radius: 4px; background: white; color: black; font-size: 10px; }

#dialog { position: absolute; z-index: 100; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.6); }
#dialog.active { display: flex; }
.dialog-box { width: 340px; max-width: 90vw; padding: 25px; border-radius: 8px; background: #111; color: white; }
.dialog-box h2 { margin: 5px 0 22px; font-size: 21px; font-weight: 400; }
.dialog-actions { display: flex; gap: 7px; margin-top: 20px; }
.dialog-actions button { flex: 1; padding: 9px; border: 0; border-radius: 4px; }

.marker-badge { width: 30px; height: 30px; border-radius: 50%; background: #0c0c0c; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }

/* Trace-Verlauf als Timeline */
.timeline { position: relative; padding-left: 22px; }
.timeline::before { content: ""; position: absolute; left: 8px; top: 2px; bottom: 2px; width: 2px; background: rgba(255,255,255,.12); }
.timeline-step { position: relative; margin-bottom: 10px; }
.timeline-step:last-child { margin-bottom: 0; }
.timeline-step::before {
  content: ""; position: absolute; left: -18px; top: 16px; width: 10px; height: 10px;
  border-radius: 50%; background: var(--step-color); box-shadow: 0 0 0 3px #0c0c0c;
}
.timeline-card { overflow: hidden; border: 1px solid rgba(255,255,255,.14); border-radius: 6px; background: rgba(255,255,255,.03); }
.timeline-header { display: flex; align-items: center; gap: 9px; padding: 10px; cursor: pointer; }
.timeline-header:hover { background: rgba(255,255,255,.05); }
.timeline-number {
  width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0; background: var(--step-color);
  color: #000; font-size: 9px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  cursor: grab;
}
.timeline-number:active { cursor: grabbing; }
.timeline-name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 11px; }
.timeline-body { display: none; padding: 12px; border-top: 1px solid rgba(255,255,255,.1); }
.timeline-step.open .timeline-body { display: block; }
.timeline-step.dragging { opacity: .85; z-index: 5; cursor: grabbing; }
.timeline-step.drag-over .timeline-card { border-color: #ffd400; }
</style>
</head>
<body>

<div id="map"></div>

<aside id="sidebar" class="panel">
  <div class="panel-header">
    <div>
      <div class="kicker">MAP PROJECT</div>
      <div class="panel-title">Map Editor</div>
    </div>
  </div>

  <section class="section">
    <div class="section-header">
      <div>
        <div class="section-title">Startseite</div>
        <div class="section-subtitle">Intro-Text</div>
      </div>
    </div>
    <textarea id="introText" style="min-height:100px;"></textarea>
    <button id="saveIntro" class="small-button" style="margin-top:8px;width:100%;">Speichern</button>
  </section>

  <section class="section">
    <div class="section-header">
      <div>
        <div class="section-title">Traces</div>
        <div class="section-subtitle">GPX-Strecken + Verlauf</div>
      </div>
      <button id="gpxButton" class="small-button">+ GPX</button>
    </div>
    <input id="gpxInput" type="file" accept=".gpx" hidden>
    <div id="routesList" class="route-list"></div>

  <div id="status">Karte wird geladen ...</div>

  <div class="panel-header">
    <button id="detailClose" class="icon-button">← Zur Liste</button>
    <div class="actions" style="flex:none;">
      <button id="detailFocus" class="small-button">Fokussieren</button>
      <button id="detailDelete" class="small-button delete">Löschen</button>
    </div>
  </div>
  <div class="kicker">TRACE BEARBEITEN</div>
  <div class="detail-title" id="detailName">–</div>

  <section class="section">
    <div class="section-title">Einstellungen</div>
    <label>Name<input id="fieldName" type="text"></label>
    <label>Linienstärke<input id="fieldWidth" type="range" min="1" max="12"></label>
  </section>

  <section class="section">
    <div class="section-title">Statistik &amp; Medien</div>
    <div class="field-row">
      <label>Dauer (Minuten)<input id="fieldDuration" type="number"></label>
      <label>Distanz (km)<input id="fieldDistance" type="number" step="0.1"></label>
    </div>
    <label>Notizen (optional)<textarea id="fieldNotes"></textarea></label>

    </label>

  <section class="section">
    <div class="section-header">
      <div>
        <div class="section-title">Verlauf</div>
        <div class="section-subtitle">Timeline der Schritte</div>
      </div>
      <button id="addStepButton" class="small-button">+ Schritt</button>

    <div id="timeline" class="timeline"></div>
  </section>
</aside>

<div id="dialog">
  <div class="dialog-box">
    <div class="kicker">NEW TRACE</div>
    <h2>GPX importieren</h2>
    <label>Name<input id="routeName" type="text"></label>
    <label>Linienstärke<input id="routeWidth" type="range" min="1" max="12" value="5"></label>
    <div class="dialog-actions">
      <button id="cancelGpx">Abbrechen</button>
      <button id="confirmGpx">Importieren</button>
    </div>
  </div>
</div>

<script>
mapboxgl.accessToken = MAPBOX_TOKEN;

const map = new mapboxgl.Map({
  container: "map",
  style: "mapbox://styles/leonroca/cmu5b7jcz003g01sagg39fgfx",
  center: [8.5417, 47.3769],
  zoom: 12
});

const STEP_COLORS = ["#ffd400", "#4dd0e1", "#ff6b6b", "#a78bfa", "#66bb6a", "#ff9f43"];
const CATEGORY_LABELS = { weg: "Weg (kein Marker)", lost_and_found: "Lost and Found", commission: "Commission", scan: "Scan" };
const LOOK_CATEGORY_LABELS = { hut: "Hut", oberteil: "Oberteil", hose: "Hose", schuh: "Schuh" };

let routes = [];
let markers = [];
let pendingGpx = null;
let placingStep = null;
let selectedRouteId = null;

const routesList = document.getElementById("routesList");
const statusElement = document.getElementById("status");
const detailPanel = document.getElementById("detail");
const detailName = document.getElementById("detailName");
const timelineEl = document.getElementById("timeline");

function status(text) { statusElement.innerText = text; }

function syncStepMarker(step) {
  markers = markers.filter(m => {
    if (m.stepId === step.id) { m.remove(); return false; }
    return true;
  });
  if (step.category && step.category !== "weg" && step.lng && step.lat) {
    const element = document.createElement("div");
    element.className = "marker-badge";
    element.innerHTML = markerIconSvg(step.category);
    const marker = new mapboxgl.Marker({ element, draggable: true }).setLngLat([step.lng, step.lat]).addTo(map);
    marker.stepId = step.id;
    marker.on("dragend", async () => {
      const position = marker.getLngLat();
      step.lng = position.lng; step.lat = position.lat;
      await api("/api/steps/" + step.id, {
        method: "PUT",
        body: JSON.stringify({
          media_type: step.media_type, media_url: step.media_url, text_overlay: step.text_overlay,
          audio_url: step.audio_url, transition: step.transition, category: step.category,
          lng: step.lng, lat: step.lat
        })
      });
      status("Marker verschoben.");
    });
    markers.push(marker);
  }
}

map.on("click", (event) => {
  if (!placingStep) return;
  placingStep.step.lng = event.lngLat.lng;
  placingStep.step.lat = event.lngLat.lat;
  syncStepMarker(placingStep.step);
  placingStep.onPlaced();
  placingStep = null;
  status("Position gesetzt.");
});

// iPhone-Fotos landen oft als HEIC/HEIF hoch — kein Browser stellt das per
// <img>/<video> dar, darum hier vor dem Upload zu JPEG konvertieren.
async function convertHeicIfNeeded(file) {
  const isHeic = /\.hei[cf]$/i.test(file.name) || file.type === "image/heic" || file.type === "image/heif";
  if (!isHeic) return file;
  status("HEIC-Foto wird konvertiert...");
  const converted = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.9 });
  const jpegBlob = Array.isArray(converted) ? converted[0] : converted;
  return new File([jpegBlob], file.name.replace(/\.hei[cf]$/i, ".jpg"), { type: "image/jpeg" });
}

async function uploadFile(file) {
  file = await convertHeicIfNeeded(file);
  const urlResponse = await fetch("/api/upload-url", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filename: file.name, contentType: file.type })
  });
  if (!urlResponse.ok) {
    const errText = await urlResponse.text().catch(() => "");
    throw new Error("Konnte Upload-URL nicht anfordern: " + urlResponse.status + " " + errText);
  }
  const { uploadUrl, publicUrl } = await urlResponse.json();

  const putResponse = await fetch(uploadUrl, {
    method: "PUT",
    headers: file.type ? { "Content-Type": file.type } : {},
    body: file
  });
  if (!putResponse.ok) throw new Error("Upload fehlgeschlagen: " + putResponse.status);

  return { url: publicUrl };
}

/* ===== ROUTES (Traces) ===== */

function routeLayerId(route) { return "route-" + route.id; }

function drawRoute(route) {
  const id = routeLayerId(route);
  let coordinates = parseCoordinates(route.coordinates);

  if (map.getSource(id)) {
    map.getSource(id).setData({ type: "Feature", geometry: { type: "LineString", coordinates }, properties: {} });
    map.setPaintProperty(id, "line-color", route.color || "#ff453a");
    map.setPaintProperty(id, "line-width", Number(route.width || 5));
    map.setLayoutProperty(id, "visibility", route.visible === 0 ? "none" : "visible");
  } else {
    map.addSource(id, { type: "geojson", data: { type: "Feature", geometry: { type: "LineString", coordinates }, properties: {} } });
    map.addLayer({
      id, type: "line", source: id,
      layout: { "line-cap": "round", "line-join": "round", visibility: route.visible === 0 ? "none" : "visible" },
      paint: { "line-color": route.color || "#ff453a", "line-width": Number(route.width || 5), "line-opacity": .9 }
    });
  }
}

function removeRouteLayer(route) {
  const id = routeLayerId(route);
  if (map.getLayer(id)) map.removeLayer(id);
  if (map.getSource(id)) map.removeSource(id);
}

function focusRoute(route) {
  let coordinates = parseCoordinates(route.coordinates);
  if (!coordinates || coordinates.length < 2) return;
  const bounds = new mapboxgl.LngLatBounds();
  coordinates.forEach(c => bounds.extend(c));
  map.fitBounds(bounds, { padding: 100, duration: 900 });
}

async function saveRoute(route) {
  await api("/api/routes/" + route.id, {
    method: "PUT",
    body: JSON.stringify({
      name: route.name, color: route.color, width: route.width, coordinates: route.coordinates,
      visible: route.visible !== 0, duration_minutes: route.duration_minutes,
      distance_km: route.distance_km, notes: route.notes, video_url: route.video_url
    })
  });
  status("Trace gespeichert.");
}

/* ===== FOUND ITEMS (pro Schritt) ===== */

// Schneidet ein Kleidungsstück client-seitig vom Hintergrund frei (PNG mit
// Transparenz), damit der Look-Builder es sauber stapeln kann. Läuft nur im
// Admin beim Hochladen, nicht bei jedem Website-Besucher.
async function cutoutForLookBuilder(file) {
  try {
    status("Kleidungsstück wird freigestellt...");
    const blob = await window.imglyRemoveBackground(file);
    return new File([blob], file.name.replace(/\.[^.]+$/, "") + "-cutout.png", { type: "image/png" });
  } catch (error) {
    console.error("Freistellen fehlgeschlagen, nutze Originalfoto:", error);
    return null;
  }
}

function buildItemsBox(step) {
  const isLookItem = step.category === "lost_and_found";
  const itemsBox = document.createElement("div");
  itemsBox.className = "entries-box";
  itemsBox.innerHTML = '<div class="hint">Wird beim Öffnen geladen ...</div>';
  let itemsLoaded = false;
  let itemsData = [];

  function renderItems() {
    itemsBox.innerHTML = "";
    const title = document.createElement("div");
    title.className = "entries-title";
    title.innerText = isLookItem
      ? "Found Items – Kleidungsstücke für den Look-Builder"
      : "Found Items (additiv, bleiben in der Story sichtbar)";
    itemsBox.appendChild(title);

    itemsData.forEach(item => {
      const row = document.createElement("div");
      row.className = "entry-item";
      const thumb = document.createElement("img");
      thumb.className = "entry-thumb";
      thumb.src = item.cutout_url || item.image_url || "";
      const note = document.createElement("div");
      note.className = "entry-note";
      note.innerText = (isLookItem && item.category ? "[" + LOOK_CATEGORY_LABELS[item.category] + "] " : "") + (item.note || "");
      const del = document.createElement("button");
      del.className = "entry-delete";
      del.innerText = "×";
      del.addEventListener("click", async () => {
        if (!confirm("Dieses Item löschen?")) return;
        await api("/api/items/" + item.id, { method: "DELETE" });
        itemsData = itemsData.filter(i => i.id !== item.id);
        renderItems();
        status("Item gelöscht.");
      });
      row.append(thumb, note, del);
      itemsBox.appendChild(row);
    });

    const form = document.createElement("div");
    form.className = "entry-form";
    const fileLabel = document.createElement("label");
    fileLabel.innerText = "Neues Foto";
    const fileInput = document.createElement("input");
    fileInput.type = "file"; fileInput.accept = "image/*";
    fileLabel.appendChild(fileInput);

    let lookCategorySelect = null;
    if (isLookItem) {
      const lookCategoryLabel = document.createElement("label");
      lookCategoryLabel.innerText = "Kleidungs-Kategorie (für Look-Builder)";
      lookCategorySelect = document.createElement("select");
      lookCategorySelect.innerHTML = Object.keys(LOOK_CATEGORY_LABELS).map(key =>
        '<option value="' + key + '">' + LOOK_CATEGORY_LABELS[key] + '</option>'
      ).join("");
      lookCategoryLabel.appendChild(lookCategorySelect);
      form.appendChild(lookCategoryLabel);
    }

    const noteLabel = document.createElement("label");
    noteLabel.innerText = "Notiz (optional)";
    const noteInput = document.createElement("textarea");
    noteLabel.appendChild(noteInput);
    const addButton = document.createElement("button");
    addButton.className = "entry-add-button";
    addButton.innerText = "+ Item hinzufügen";
    addButton.addEventListener("click", async () => {
      let imageUrl = "";
      let cutoutUrl = "";
      if (fileInput.files[0]) {
        const file = fileInput.files[0];
        try {
          status("Foto wird hochgeladen...");
          const uploaded = await uploadFile(file);
          imageUrl = uploaded.url;

          if (isLookItem) {
            const cutoutFile = await cutoutForLookBuilder(file);
            if (cutoutFile) {
              status("Freigestelltes Bild wird hochgeladen...");
              const uploadedCutout = await uploadFile(cutoutFile);
              cutoutUrl = uploadedCutout.url;
            }
          }
        } catch (error) {
          console.error(error);
          status("Foto-Upload fehlgeschlagen.");
          return;
        }
      }
      const category = lookCategorySelect ? lookCategorySelect.value : "";
      const created = await api("/api/steps/" + step.id + "/items", {
        method: "POST",
        body: JSON.stringify({ image_url: imageUrl, note: noteInput.value, category, cutout_url: cutoutUrl })
      });
      itemsData.push({ id: created.id, image_url: imageUrl, note: noteInput.value, category, cutout_url: cutoutUrl });
      renderItems();
      status("Item hinzugefügt.");
    });
    form.append(fileLabel, noteLabel, addButton);
    itemsBox.appendChild(form);
  }

  return {
    el: itemsBox,
    load: async () => {
      if (itemsLoaded) return;
      itemsLoaded = true;
      try {
        itemsData = await api("/api/steps/" + step.id + "/items");
        renderItems();
      } catch (error) {
        console.error(error);
        itemsBox.innerHTML = '<div class="hint">Fehler beim Laden.</div>';
      }
    }
  };
}

/* ===== TIMELINE-SCHRITTE ===== */

function buildTimelineStep(step, index, total, moveStep, deleteStep) {
  const stepColor = STEP_COLORS[index % STEP_COLORS.length];
  const wrap = document.createElement("div");
  wrap.className = "timeline-step";
  wrap.style.setProperty("--step-color", stepColor);

  const card = document.createElement("div");
  card.className = "timeline-card";

  function stepLabel() {
    const category = step.category && step.category !== "weg" ? " · " + CATEGORY_LABELS[step.category] : "";
    return (step.media_type || "image") + category;
  }

  const header = document.createElement("div");
  header.className = "timeline-header";
  const number = document.createElement("div");
  number.className = "timeline-number";
  number.innerText = index + 1;
  number.title = "Ziehen zum Umsortieren";
  const nameWrap = document.createElement("div");
  nameWrap.className = "timeline-name";
  nameWrap.innerText = stepLabel();
  header.append(number, nameWrap);
  card.appendChild(header);

  const body = document.createElement("div");
  body.className = "timeline-body";

  const typeLabel = document.createElement("label");
  typeLabel.innerText = "Medien-Typ";
  const typeSelect = document.createElement("select");
  typeSelect.innerHTML =
    '<option value="image"' + (step.media_type === "image" ? " selected" : "") + '>Bild</option>' +
    '<option value="video"' + (step.media_type === "video" ? " selected" : "") + '>Video</option>' +
    '<option value="model"' + (step.media_type === "model" ? " selected" : "") + '>3D-Scan (.glb)</option>';
  typeLabel.appendChild(typeSelect);

  const categoryLabel = document.createElement("label");
  categoryLabel.innerText = "Kategorie";
  const categorySelect = document.createElement("select");
  categorySelect.innerHTML = Object.keys(CATEGORY_LABELS).map(key =>
    '<option value="' + key + '"' + ((step.category || "weg") === key ? " selected" : "") + '>' + CATEGORY_LABELS[key] + '</option>'
  ).join("");
  categoryLabel.appendChild(categorySelect);

  const positionBox = document.createElement("div");
  positionBox.style.marginBottom = "13px";
  const positionStatus = document.createElement("div");
  positionStatus.className = "hint";
  positionStatus.innerText = (step.lng && step.lat) ? "Position gesetzt." : "Noch keine Position gesetzt.";
  const placeButton = document.createElement("button");
  placeButton.className = "small-button";
  placeButton.style.width = "100%";
  placeButton.style.marginTop = "6px";
  placeButton.innerText = (step.lng && step.lat) ? "Position ändern" : "Auf Karte platzieren";
  positionBox.append(positionStatus, placeButton);
  positionBox.style.display = (step.category && step.category !== "weg") ? "block" : "none";

  const mediaLabel = document.createElement("label");
  mediaLabel.innerText = "Hauptmedium";
  const mediaUrlInput = document.createElement("input");
  mediaUrlInput.type = "text"; mediaUrlInput.placeholder = "https://..."; mediaUrlInput.value = step.media_url || "";
  const mediaUpload = document.createElement("input");
  mediaUpload.type = "file";
  mediaLabel.append(mediaUrlInput, mediaUpload);

  const textLabel = document.createElement("label");
  textLabel.innerText = "Text-Overlay (optional)";
  const textInput = document.createElement("textarea");
  textInput.value = step.text_overlay || "";
  textLabel.appendChild(textInput);

  const itemsBoxWrap = buildItemsBox(step);

  const actions = document.createElement("div");
  actions.className = "actions";
  const up = document.createElement("button");
  up.innerText = "↑"; up.disabled = index === 0;
  const down = document.createElement("button");
  down.innerText = "↓"; down.disabled = index === total - 1;
  const del = document.createElement("button");
  del.innerText = "Löschen"; del.className = "delete";
  actions.append(up, down, del);

  body.append(typeLabel, categoryLabel, positionBox, mediaLabel, textLabel, itemsBoxWrap.el, actions);
  card.appendChild(body);
  wrap.appendChild(card);

  header.addEventListener("click", () => {
    wrap.classList.toggle("open");
    if (wrap.classList.contains("open")) itemsBoxWrap.load();
  });

  async function persist() {
    await api("/api/steps/" + step.id, {
      method: "PUT",
      body: JSON.stringify({
        media_type: step.media_type, media_url: step.media_url,
        text_overlay: step.text_overlay, audio_url: step.audio_url, transition: step.transition,
        category: step.category, lng: step.lng, lat: step.lat
      })
    });
    status("Schritt gespeichert.");
  }

  typeSelect.addEventListener("change", () => {
    step.media_type = typeSelect.value;
    nameWrap.innerText = stepLabel();
    persist();
  });
  categorySelect.addEventListener("change", () => {
    step.category = categorySelect.value;
    nameWrap.innerText = stepLabel();
    positionBox.style.display = step.category !== "weg" ? "block" : "none";
    persist();
    syncStepMarker(step);
  });
  mediaUrlInput.addEventListener("change", () => { step.media_url = mediaUrlInput.value; persist(); });
  textInput.addEventListener("change", () => { step.text_overlay = textInput.value; persist(); });

  placeButton.addEventListener("click", (event) => {
    event.stopPropagation();
    placingStep = {
      step,
      onPlaced: () => {
        placeButton.innerText = "Position ändern";
        positionStatus.innerText = "Position gesetzt.";
        persist();
      }
    };
    status(`Jetzt auf die Karte klicken, um Schritt ${index + 1} zu platzieren.`);
  });

  mediaUpload.addEventListener("change", async () => {
    const file = mediaUpload.files[0];
    if (!file) return;
    status("Medium wird hochgeladen...");
    try {
      const uploaded = await uploadFile(file);
      step.media_url = uploaded.url;
      mediaUrlInput.value = uploaded.url;
      await persist();
      status("Medium hochgeladen.");
    } catch (error) {
      console.error(error);
      status("Upload fehlgeschlagen.");
    }
  });

  up.addEventListener("click", () => moveStep(step.id, -1));
  down.addEventListener("click", () => moveStep(step.id, 1));

  del.addEventListener("click", async () => {
    if (!confirm("Diesen Schritt wirklich löschen?")) return;
    await deleteStep(step.id);
    status("Schritt gelöscht.");
  });

  return wrap;
}

function renderTimeline(route) {
  timelineEl.innerHTML = "";
  if (!route.steps || route.steps.length === 0) {
    timelineEl.innerHTML = '<div class="empty-state">Noch keine Schritte in dieser Trace.</div>';
    return;
  }

  async function moveStep(stepId, direction) {
    const idx = route.steps.findIndex(s => s.id === stepId);
    if (idx < 0) return;
    const newIdx = idx + direction;
    if (newIdx < 0 || newIdx >= route.steps.length) return;
    const temp = route.steps[idx];
    route.steps[idx] = route.steps[newIdx];
    route.steps[newIdx] = temp;
    const order = route.steps.map((s, i) => ({ id: s.id, position: i }));
    await api("/api/steps/reorder", { method: "POST", body: JSON.stringify({ order }) });
    renderTimeline(route);
  }

  async function deleteStep(stepId) {
    const step = route.steps.find(s => s.id === stepId);
    await api("/api/steps/" + stepId, { method: "DELETE" });
    route.steps = route.steps.filter(s => s.id !== stepId);
    if (step) syncStepMarker({ ...step, category: "weg" });
    renderTimeline(route);
    renderRouteList();
  }

  // Per Drag-Handle (die Nummer) an eine beliebige Position ziehen, statt
  // sich mit ↑/↓ Schritt für Schritt durchzuklicken.
  async function moveStepToIndex(stepId, newIndex) {
    const idx = route.steps.findIndex(s => s.id === stepId);
    if (idx < 0) return;
    const clamped = Math.max(0, Math.min(route.steps.length - 1, newIndex));
    if (clamped === idx) return;
    const [moved] = route.steps.splice(idx, 1);
    route.steps.splice(clamped, 0, moved);
    const order = route.steps.map((s, i) => ({ id: s.id, position: i }));
    await api("/api/steps/reorder", { method: "POST", body: JSON.stringify({ order }) });
    renderTimeline(route);
  }

  // Pointer-Events statt nativem HTML5-Drag: zuverlässiger über Browser und
  // Touch hinweg (dieselbe Technik wie beim Verschieben der Karten-Panels).
  route.steps.forEach((step, index) => {
    const stepEl = buildTimelineStep(step, index, route.steps.length, moveStep, deleteStep);
    const handle = stepEl.querySelector(".timeline-number");
    handle.style.touchAction = "none";

    let dragging = false;
    let startY = 0;

    handle.addEventListener("pointerdown", (event) => {
      dragging = true;
      startY = event.clientY;
      stepEl.classList.add("dragging");
      handle.setPointerCapture(event.pointerId);
    });

    handle.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      const deltaY = event.clientY - startY;
      stepEl.style.transform = "translateY(" + deltaY + "px)";

      const currentRect = stepEl.getBoundingClientRect();
      const currentCenterY = currentRect.top + currentRect.height / 2;
      let hoverTarget = null;
      for (const sib of timelineEl.children) {
        sib.classList.remove("drag-over");
        if (sib === stepEl) continue;
        const rect = sib.getBoundingClientRect();
        if (currentCenterY > rect.top && currentCenterY < rect.bottom) hoverTarget = sib;
      }
      if (hoverTarget) hoverTarget.classList.add("drag-over");
    });

    handle.addEventListener("pointerup", () => {
      if (!dragging) return;
      dragging = false;
      stepEl.style.transform = "";
      stepEl.classList.remove("dragging");
      const overEl = timelineEl.querySelector(".drag-over");
      [...timelineEl.children].forEach(sib => sib.classList.remove("drag-over"));
      if (overEl) {
        moveStepToIndex(step.id, [...timelineEl.children].indexOf(overEl));
      }
    });

    handle.addEventListener("pointercancel", () => {
      dragging = false;
      stepEl.style.transform = "";
      stepEl.classList.remove("dragging");
      [...timelineEl.children].forEach(sib => sib.classList.remove("drag-over"));
    });

    timelineEl.appendChild(stepEl);
  });
}

/* ===== SIDEBAR: TRACE-LISTE ===== */

function renderRouteList() {
  routesList.innerHTML = "";
  if (routes.length === 0) {
    routesList.innerHTML = '<div class="hint">Noch keine Traces importiert.</div>';
    return;
  }

  routes.forEach(route => {
    const card = document.createElement("div");
    card.className = "route-card" + (route.id === selectedRouteId ? " selected" : "");

    const color = document.createElement("div");
    color.className = "route-color";
    color.style.background = route.color;

    const body = document.createElement("div");
    body.className = "route-card-body";
    const name = document.createElement("div");
    name.className = "route-card-name";
    name.innerText = route.name;
    const meta = document.createElement("div");
    meta.className = "route-card-meta";
    meta.innerText = (route.steps ? route.steps.length : 0) + " Schritte";
    body.append(name, meta);

    const visibility = document.createElement("button");
    visibility.className = "visibility";
    visibility.innerText = route.visible === 0 ? "○" : "●";
    visibility.title = "Sichtbarkeit umschalten";
    visibility.addEventListener("click", async (event) => {
      event.stopPropagation();
      route.visible = route.visible === 0 ? 1 : 0;
      visibility.innerText = route.visible === 0 ? "○" : "●";
      drawRoute(route);
      await saveRoute(route);
    });

    card.append(color, body, visibility);
    card.addEventListener("click", () => selectRoute(route.id));
    routesList.appendChild(card);
  });
}

  selectedRouteId = id;
  renderRouteList();
  renderDetail();
}

function closeDetail() {
  selectedRouteId = null;
  renderRouteList();
  renderDetail();
}

  const route = routes.find(r => r.id === selectedRouteId);
  if (!route) {
    detailPanel.classList.remove("active");
    return;
  }
  detailPanel.classList.add("active");
  detailName.innerText = route.name;

  const nameInput = document.getElementById("fieldName");
  const widthInput = document.getElementById("fieldWidth");
  const durationInput = document.getElementById("fieldDuration");
  const distanceInput = document.getElementById("fieldDistance");
  const notesInput = document.getElementById("fieldNotes");
  const videoInput = document.getElementById("fieldVideoUrl");
  const videoUpload = document.getElementById("fieldVideoUpload");

  nameInput.value = route.name;
  widthInput.value = route.width;
  durationInput.value = route.duration_minutes || "";
  distanceInput.value = route.distance_km || "";
  notesInput.value = route.notes || "";
  videoInput.value = route.video_url || "";
  videoUpload.value = "";

  async function persistRoute() {
    await saveRoute(route);
    drawRoute(route);
    detailName.innerText = route.name;
    renderRouteList();
  }

  nameInput.onchange = () => { route.name = nameInput.value; persistRoute(); };
  widthInput.onchange = () => { route.width = Number(widthInput.value); persistRoute(); };
  durationInput.onchange = () => { route.duration_minutes = durationInput.value ? Number(durationInput.value) : null; persistRoute(); };
  distanceInput.onchange = () => { route.distance_km = distanceInput.value ? Number(distanceInput.value) : null; persistRoute(); };
  notesInput.onchange = () => { route.notes = notesInput.value; persistRoute(); };
  videoInput.onchange = () => { route.video_url = videoInput.value; persistRoute(); };

  videoUpload.onchange = async () => {
    const file = videoUpload.files[0];
    if (!file) return;
    status("Video wird hochgeladen...");
    try {
      const uploaded = await uploadFile(file);
      route.video_url = uploaded.url;
      videoInput.value = uploaded.url;
      await persistRoute();
      status("Video hochgeladen.");
    } catch (error) {
      console.error(error);
      status("Video-Upload fehlgeschlagen.");
    }
  };

  document.getElementById("detailFocus").onclick = () => focusRoute(route);

  document.getElementById("detailDelete").onclick = async () => {
    if (!confirm("Diese Trace wirklich löschen?")) return;
    await api("/api/routes/" + route.id, { method: "DELETE" });
    removeRouteLayer(route);
    (route.steps || []).forEach(s => syncStepMarker({ ...s, category: "weg" }));
    routes = routes.filter(r => r.id !== route.id);
    closeDetail();
    status("Trace gelöscht.");
  };

  document.getElementById("addStepButton").onclick = async () => {
    const created = await api("/api/routes/" + route.id + "/steps", {
      method: "POST",
      body: JSON.stringify({ media_type: "image", category: "weg" })
    });
    route.steps = route.steps || [];
    route.steps.push({ id: created.id, route_id: route.id, position: created.position, media_type: "image", media_url: "", text_overlay: "", audio_url: "", transition: "cut", category: "weg", lng: null, lat: null });
    renderTimeline(route);
    renderRouteList();
    status("Schritt hinzugefügt.");
  };

  renderTimeline(route);
}

document.getElementById("detailClose").addEventListener("click", closeDetail);

/* ===== GPX IMPORT ===== */

document.getElementById("gpxButton").addEventListener("click", () => document.getElementById("gpxInput").click());

// Entfernt GPS-Zittern (kurzes Hin-und-Her durch ungenaue Fixes) per Median-Filter,
// BEVOR vereinfacht wird. Ein Median ignoriert einzelne Ausreisser, ohne wie ein
// Mittelwert von ihnen "mitgezogen" zu werden, und schneidet echte Richtungswechsel
// nicht weg. simplifyGpxPoints() danach reduziert nur noch die Punktanzahl — gegen
// Zittern allein hilft es nicht, weil es Punkte, die stark abweichen, gerade behält.
function smoothGpxPoints(points, windowSize) {
  const half = Math.floor(windowSize / 2);
  function median(values) {
    const sorted = values.slice().sort((a, b) => a - b);
    const mid = Math.floor(sorted.length / 2);
    return sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
  }
  return points.map((_, i) => {
    const start = Math.max(0, i - half);
    const end = Math.min(points.length - 1, i + half);
    const window = points.slice(start, end + 1);
    return [median(window.map(p => p[0])), median(window.map(p => p[1]))];
  });
}

function simplifyGpxPoints(points, toleranceMeters) {
  function haversineSimple(a, b) {
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(b[1] - a[1]);
    const dLng = toRad(b[0] - a[0]);
    const lat1 = toRad(a[1]), lat2 = toRad(b[1]);
    const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function perpendicularDistance(pt, lineStart, lineEnd) {
    const [x, y] = pt, [x1, y1] = lineStart, [x2, y2] = lineEnd;
    const dx = x2 - x1, dy = y2 - y1;
    if (dx === 0 && dy === 0) return haversineSimple(pt, lineStart);
    const t = ((x - x1) * dx + (y - y1) * dy) / (dx * dx + dy * dy);
    const clampedT = Math.max(0, Math.min(1, t));
    return haversineSimple(pt, [x1 + clampedT * dx, y1 + clampedT * dy]);
  }
  function simplifySection(section, epsilon) {
    if (section.length < 3) return section;
    let maxDist = 0, index = 0;
    const start = section[0], end = section[section.length - 1];
    for (let i = 1; i < section.length - 1; i++) {
      const dist = perpendicularDistance(section[i], start, end);
      if (dist > maxDist) { maxDist = dist; index = i; }
    }
    if (maxDist > epsilon) {
      const left = simplifySection(section.slice(0, index + 1), epsilon);
      const right = simplifySection(section.slice(index), epsilon);
      return left.slice(0, -1).concat(right);
    }
    return [start, end];
  }
  return simplifySection(points, toleranceMeters);
}
document.getElementById("gpxInput").addEventListener("change", (event) => {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const xml = new DOMParser().parseFromString(e.target.result, "application/xml");
      const trackPoints = xml.getElementsByTagName("trkpt");
      const coordinates = [];

      for (let i = 0; i < trackPoints.length; i++) {
        const lat = parseFloat(trackPoints[i].getAttribute("lat"));
        const lon = parseFloat(trackPoints[i].getAttribute("lon"));
        if (!isNaN(lat) && !isNaN(lon)) coordinates.push([lon, lat]);
      }

      if (coordinates.length < 2) throw new Error("Keine GPX-Trackpunkte gefunden.");

      const cleanedCoordinates = simplifyGpxPoints(smoothGpxPoints(coordinates, 5), 18);
      pendingGpx = { coordinates: cleanedCoordinates, filename: file.name.replace(/\.gpx$/i, "") };
      document.getElementById("routeName").value = pendingGpx.filename;
      document.getElementById("dialog").classList.add("active");
    } catch (error) {
      console.error(error);
      status("GPX konnte nicht gelesen werden.");
    }
  };
  reader.readAsText(file);
  event.target.value = "";
});

document.getElementById("cancelGpx").addEventListener("click", () => {
  pendingGpx = null;
  document.getElementById("dialog").classList.remove("active");
});

document.getElementById("confirmGpx").addEventListener("click", async () => {
  if (!pendingGpx) return;

  const newRoute = {
    name: document.getElementById("routeName").value.trim() || pendingGpx.filename,
    // Nur für die Unterscheidung im Editor selbst — auf der Public-Seite
    // sind Trace-Linien global weiss, kein Farbfeld mehr im UI.
    color: STEP_COLORS[routes.length % STEP_COLORS.length],
    width: Number(document.getElementById("routeWidth").value),
    coordinates: pendingGpx.coordinates,
    visible: true
  };

  const created = await api("/api/routes", { method: "POST", body: JSON.stringify(newRoute) });
  const route = { ...newRoute, id: created.id, visible: 1, steps: [] };
  routes.push(route);
  drawRoute(route);
  selectRoute(route.id);
  focusRoute(route);

  pendingGpx = null;
  document.getElementById("dialog").classList.remove("active");
  status("Trace importiert.");
});

/* ===== INTRO TEXT ===== */

async function loadIntro() {
  const data = await api("/api/settings/intro");
  document.getElementById("introText").value = data.value;
}
document.getElementById("saveIntro").addEventListener("click", async () => {
  await api("/api/settings/intro", {
    method: "PUT",
    body: JSON.stringify({ value: document.getElementById("introText").value })
  });
  status("Intro-Text gespeichert.");
});

/* ===== LOAD ===== */

async function loadData() {
  try {
    routes = await api("/api/routes");
    routes.forEach(r => { r.coordinates = parseCoordinates(r.coordinates); });
    await Promise.all(routes.map(async r => {
      try { r.steps = await api("/api/routes/" + r.id + "/steps"); }
      catch (e) { r.steps = []; }
    }));
    routes.forEach(drawRoute);
    routes.forEach(r => (r.steps || []).forEach(s => syncStepMarker(s)));
    renderRouteList();
    renderDetail();
    loadIntro();
    status("Karte bereit.");
  } catch (error) {
    console.error(error);
    status("Fehler beim Laden der Daten.");
  }
}

map.on("load", loadData);
