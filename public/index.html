<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
#map { position: absolute; top: 26px; left: 0; right: 0; bottom: 26px; }

.marker { width: 17px; height: 17px; border-radius: 50%; border: 3px solid black; background: white; }

.marquee-bar {
  position: fixed; left: 0; right: 0; height: 26px;
  overflow: hidden; background: #000; z-index: 30;
}
.marquee-top { top: 0; border-bottom: 1px solid rgba(255,255,255,.15); }
.marquee-bottom { bottom: 0; border-top: 1px solid rgba(255,255,255,.15); }
.marquee-track { display: flex; width: max-content; animation: marquee-scroll 28s linear infinite; }
.marquee-track span {
  white-space: nowrap; padding-right: 60px;
  font-size: 11px; letter-spacing: .08em; color: #fff; line-height: 26px;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
}
@keyframes marquee-scroll {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

#spiderSvg { position: absolute; top: 26px; left: 0; right: 0; bottom: 26px; z-index: 24; pointer-events: none; }
#spiderLayer { position: absolute; top: 26px; left: 0; right: 0; bottom: 26px; z-index: 25; pointer-events: none; }

.spider-panel {
  position: absolute;
  width: 230px;
  height: 260px;
  min-width: 180px;
  min-height: 120px;
  overflow: auto;
  resize: both;
  background: rgba(12,12,12,.96);
  color: white;
  border: 1px solid rgba(255,255,255,.15);
  border-top: 3px solid transparent;
  border-radius: 8px;
  padding: 16px;
  pointer-events: all;
  transform: translate(-50%, -50%);
  font-size: 11px;
}
.panel-drag-handle {
  height: 14px;
  margin: -16px -16px 10px -16px;
  border-radius: 8px 8px 0 0;
  background: rgba(255,255,255,.06);
  cursor: grab;
  touch-action: none;
}
.panel-drag-handle:active { cursor: grabbing; }
.panel-kicker { font-size: 8px; letter-spacing: .15em; opacity: .5; margin-bottom: 6px; text-transform: uppercase; }
.spider-panel h3 { margin: 0 0 10px; font-size: 15px; font-weight: 400; }
.spider-panel p { margin: 0 0 6px; opacity: .8; line-height: 1.5; white-space: pre-wrap; }
.panel-close { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: white; font-size: 18px; cursor: pointer; opacity: .6; }
.panel-close:hover { opacity: 1; }
.spider-entry { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,.08); }
.spider-entry:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
.spider-entry img { width: 100%; border-radius: 4px; margin-bottom: 6px; display: block; }
.spider-video { width: 100%; border-radius: 4px; margin-top: 8px; }

#closeAllPanels {
  position: absolute; top: 44px; right: 18px; z-index: 26;
  display: none;
  padding: 9px 14px; border: 0; border-radius: 4px;
  background: white; color: black; font-size: 10px; cursor: pointer;
}
</style>
</head>
<body>

<div class="marquee-bar marquee-top">
  <div class="marquee-track">
    <span>CUTTING FROM MEMORY — CLOTHES INSPIRED BY THE PEOPLE AND STREETS OF ZURICH — FROM TRACES TO DESIGN —</span>
    <span>CUTTING FROM MEMORY — CLOTHES INSPIRED BY THE PEOPLE AND STREETS OF ZURICH — FROM TRACES TO DESIGN —</span>
  </div>
</div>

<div id="map"></div>
<svg id="spiderSvg"></svg>
<div id="spiderLayer"></div>
<button id="closeAllPanels">Alle Panels schließen</button>
