<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>Cutting from Memory</title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/landing.css">
<script>
  // Theme vor dem ersten Zeichnen setzen (Standard dunkel; ?t=light|dark oder die letzte Wahl).
  try {
    var q = new URLSearchParams(location.search).get("t"), saved = localStorage.getItem("cfm-theme"), t = q || saved || "dark";
    if (q) localStorage.setItem("cfm-theme", q);
    document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
  } catch (e) { document.documentElement.dataset.theme = "dark"; }
  // Kommt man von einer Unterseite zurück, wird das Start-Logo übersprungen.
  try {
    if (document.referrer && new URL(document.referrer).origin === location.origin) {
      document.documentElement.classList.add("no-splash");
    }
  } catch (e) {}
</script>
</head>
<body>
<div id="bg"></div>
<button class="theme-toggle" id="themeBtn" aria-label="Switch theme">◐</button>

<div id="splash" role="button" tabindex="0" aria-label="Enter">
  <div id="splashBase" class="splash-layer"></div>
  <div id="splashLens" class="splash-lens"><div id="splashZoom" class="splash-layer"></div></div>
  <div class="splash-hint">Touch to magnify · tap to enter</div>
</div>

<header class="site-header">
  <a href="/" id="logo" aria-label="Home"></a>
  <p id="intro"></p>
  <form id="idForm" class="id-form" autocomplete="off">
    <input id="idInput" type="text" inputmode="decimal" placeholder="Insert TRACE-ID to track your Item" aria-label="Trace-ID">
    <button class="btn" type="submit">Trace-ID</button>
  </form>
  <p id="idError" class="id-error" hidden></p>
</header>

<main>
  <p class="touch-hint">Press and hold a look to magnify · tap to open</p>
  <div id="looks" class="looks"></div>
  <p id="empty" class="empty" hidden>No looks yet.</p>
</main>

<script src="/js/common.js"></script>
<script src="/js/landing.js"></script>
</body>
</html>
