<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
#map { position: absolute; inset: 0; }

.marker { width: 17px; height: 17px; border-radius: 50%; border: 3px solid black; background: white; }

#spiderSvg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 24; pointer-events: none; }
#spiderLayer { position: absolute; inset: 0; z-index: 25; pointer-events: none; }

.spider-panel {
  position: absolute;
  width: 230px;
  max-height: 300px;
  overflow-y: auto;
  background: rgba(12,12,12,.96);
  color: white;
  border: 1px solid rgba(255,255,255,.15);
  border-top: 3px solid transparent;
  border-radius: 8px;
  padding: 16px;
  pointer-events: all;
  transform: translate(-50%, -50%);
  font-size: 11px;
}
.panel-kicker { font-size: 8px; letter-spacing: .15em; opacity: .5; margin-bottom: 6px; text-transform: uppercase; }
.spider-panel h3 { margin: 0 0 10px; font-size: 15px; font-weight: 400; }
.spider-panel p { margin: 0 0 6px; opacity: .8; line-height: 1.5; white-space: pre-wrap; }
.panel-close { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: white; font-size: 18px; cursor: pointer; opacity: .6; }
.panel-close:hover { opacity: 1; }
.spider-entry { margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,.08); }
.spider-entry:last-child { border-bottom: 0; margin-bottom: 0; padding-bottom: 0; }
.spider-entry img { width: 100%; border-radius: 4px; margin-bottom: 6px; display: block; }
.spider-video { width: 100%; border-radius: 4px; margin-top: 8px; }

#closeAllPanels {
  position: absolute; top: 18px; right: 18px; z-index: 26;
  display: none;
  padding: 9px 14px; border: 0; border-radius: 4px;
  background: white; color: black; font-size: 10px; cursor: pointer;
}
</style>
</head>
<body>

<div id="map"></div>
<svg id="spiderSvg"></svg>
<div id="spiderLayer"></div>
<button id="closeAllPanels">Alle Panels schließen</button>

<script>
mapboxgl.accessToken = "pk.eyJ1IjoibGVvbnJvY2EiLCJhIjoiY21wYmY1Yjl6MDNxczJxc2U0MzByNHA3OCJ9.-BaGJWtZCr3lKDKP1o9THQ";

const TYPE_LABELS = { lost_and_found: "Lost and Found", commission: "Commission", scan: "Scan" };

const map = new mapboxgl.Map({
  container: "map",
  style: "mapbox://styles/mapbox/dark-v11",
  center: [8.5417, 47.3769],
  zoom: 12
});

let points = [];
let routes = [];
let panels = [];
let simulation = null;

const spiderLayer = document.getElementById("spiderLayer");
const spiderSvg = document.getElementById("spiderSvg");
const closeAllButton = document.getElementById("closeAllPanels");

function escapeHtml(str) {
  const div = document.createElement("div");
  div.innerText = str || "";
  return div.innerHTML;
}

function drawRoute(route) {
  const id = "route-" + route.id;
  let coordinates = route.coordinates;
  if (typeof coordinates === "string") coordinates = JSON.parse(coordinates);

  map.addSource(id, { type: "geojson", data: { type: "Feature", geometry: { type: "LineString", coordinates }, properties: {} } });
  map.addLayer({
    id, type: "line", source: id,
    layout: { "line-cap": "round", "line-join": "round", visibility: route.visible === 0 ? "none" : "visible" },
    paint: { "line-color": route.color || "#ff453a", "line-width": Number(route.width || 5), "line-opacity": .9 }
  });

  map.on("click", id, () => openTracePanels(route));
  map.on("mouseenter", id, () => { map.getCanvas().style.cursor = "pointer"; });
  map.on("mouseleave", id, () => { map.getCanvas().style.cursor = ""; });
}

function createMarker(point) {
  if (point.visible === 0) return;
  const element = document.createElement("div");
  element.className = "marker";
  new mapboxgl.Marker({ element }).setLngLat([point.lng, point.lat]).addTo(map);
}

function routeCentroid(route) {
  let coordinates = route.coordinates;
  if (typeof coordinates === "string") coordinates = JSON.parse(coordinates);
  const bounds = new mapboxgl.LngLatBounds();
  coordinates.forEach(c => bounds.extend(c));
  const center = bounds.getCenter();
  return [center.lng, center.lat];
}

async function loadPointEntries(point) {
  if (point.entries) return point.entries;
  const response = await fetch("/api/points/" + point.id + "/entries");
  point.entries = await response.json();
  return point.entries;
}

function closeAllPanels() {
  if (simulation) { simulation.stop(); simulation = null; }
  spiderLayer.innerHTML = "";
  spiderSvg.innerHTML = "";
  panels = [];
  closeAllButton.style.display = "none";
}

function drawLines() {
  spiderSvg.innerHTML = "";
  panels.forEach(n => {
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", n.anchorX);
    line.setAttribute("y1", n.anchorY);
    line.setAttribute("x2", n.x);
    line.setAttribute("y2", n.y);
    line.setAttribute("stroke", n.routeColor);
    line.setAttribute("stroke-width", "1.5");
    line.setAttribute("stroke-opacity", "0.75");
    spiderSvg.appendChild(line);
  });
}

async function openTracePanels(route) {
  closeAllPanels();

  const relatedPoints = points.filter(p => p.route_id === route.id);

  let routeCoordinates = route.coordinates;
  if (typeof routeCoordinates === "string") routeCoordinates = JSON.parse(routeCoordinates);
  const bounds = new mapboxgl.LngLatBounds();
  routeCoordinates.forEach(c => bounds.extend(c));
  relatedPoints.forEach(p => bounds.extend([p.lng, p.lat]));
  map.fitBounds(bounds, { padding: 160, duration: 0 });

  const items = [{ type: "statistics" }, ...relatedPoints.map(p => ({ type: "point", point: p }))];
  const total = items.length;
  const radius = Math.max(190, 40 * total);
  const routeColor = route.color || "#ff453a";

  const nodes = items.map((item, index) => {
    const angle = (index / total) * Math.PI * 2 - Math.PI / 2;
    const anchorLngLat = item.type === "statistics" ? routeCentroid(route) : [item.point.lng, item.point.lat];
    const anchorScreen = map.project(anchorLngLat);

    const el = document.createElement("div");
    el.className = "spider-panel";
    el.style.borderTopColor = routeColor;

    if (item.type === "statistics") {
      el.innerHTML =
        '<button class="panel-close">×</button>' +
        '<div class="panel-kicker">TRACE STATISTICS</div>' +
        '<h3>' + escapeHtml(route.name) + '</h3>' +
        '<p>Dauer: ' + (route.duration_minutes ? route.duration_minutes + ' min' : '–') + '</p>' +
        '<p>Distanz: ' + (route.distance_km ? route.distance_km + ' km' : '–') + '</p>' +
        (route.notes ? '<p>' + escapeHtml(route.notes) + '</p>' : '') +
        (route.video_url ? '<video class="spider-video" controls src="' + route.video_url + '"></video>' : '');
    } else {
      const p = item.point;
      el.innerHTML =
        '<button class="panel-close">×</button>' +
        '<div class="panel-kicker">' + (TYPE_LABELS[p.type] || p.type) + '</div>' +
        '<h3>' + escapeHtml(p.title || 'Objekt') + '</h3>' +
        '<div class="entries-container"><p style="opacity:.5;">Lädt ...</p></div>';

      loadPointEntries(p).then(entries => {
        const container = el.querySelector(".entries-container");
        if (!entries.length) {
          container.innerHTML = '<p style="opacity:.5;">Keine Einträge.</p>';
          return;
        }
        container.innerHTML = entries.map(entry =>
          '<div class="spider-entry">' +
          (entry.image_url ? '<img src="' + entry.image_url + '">' : '') +
          (entry.note ? '<p>' + escapeHtml(entry.note) + '</p>' : '') +
          '</div>'
        ).join("");
      });
    }

    spiderLayer.appendChild(el);

        const panelRect = el.getBoundingClientRect();
    const node = {
      el, anchorLngLat, routeColor,
      anchorX: anchorScreen.x, anchorY: anchorScreen.y,
      radius, collideRadius: Math.max(panelRect.width, panelRect.height) / 2 + 15,
      x: anchorScreen.x + Math.cos(angle) * radius,
      y: anchorScreen.y + Math.sin(angle) * radius
    };

    el.querySelector(".panel-close").addEventListener("click", () => {
      el.remove();
      panels = panels.filter(n => n.el !== el);
      simulation.nodes(panels).alpha(0.3).restart();
    });

    return node;
  });

  panels = nodes;

  simulation = d3.forceSimulation(nodes)
    .force("radial", d3.forceRadial(d => d.radius, d => d.anchorX, d => d.anchorY).strength(0.7))
    .force("collide", d3.forceCollide(d => d.collideRadius).strength(0.9))
    .on("tick", () => {
      nodes.forEach(n => {
        n.el.style.left = n.x + "px";
        n.el.style.top = n.y + "px";
      });
      drawLines();
    });

  closeAllButton.style.display = "block";
}

closeAllButton.addEventListener("click", closeAllPanels);

map.on("move", () => {
  if (!simulation) return;
  panels.forEach(n => {
    const screen = map.project(n.anchorLngLat);
    n.anchorX = screen.x;
    n.anchorY = screen.y;
  });
  simulation.alpha(0.5).restart();
});

async function loadData() {
  try {
    const [pointsResponse, routesResponse] = await Promise.all([
      fetch("/api/points"),
      fetch("/api/routes")
    ]);
    points = await pointsResponse.json();
    routes = await routesResponse.json();

    routes.forEach(drawRoute);
    points.forEach(createMarker);
  } catch (error) {
    console.error("Konnte Daten nicht laden:", error);
  }
}

map.on("load", loadData);
</script>

</body>
</html>
