<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.js"></script>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
#map { position: absolute; inset: 0; }

.marker {
  width: 17px; height: 17px;
  border-radius: 50%;
  border: 3px solid black;
  background: white;
  cursor: pointer;
  transition: transform .15s ease;
}
.marker:hover { transform: scale(1.35); }

#contentPanel {
  position: absolute; z-index: 30;
  top: 0; right: 0;
  width: 420px; max-width: 90vw; height: 100%;
  overflow-y: auto;
  padding: 35px;
  background: rgba(8,8,8,.97);
  color: white;
  transform: translateX(100%);
  transition: transform .35s ease;
}
#contentPanel.active { transform: translateX(0); }

#closePanel {
  position: absolute; top: 15px; right: 18px;
  width: 30px; height: 30px;
  padding: 0; border: 0;
  background: transparent; color: white;
  font-size: 25px; cursor: pointer;
}

#panelImage { display: none; width: 100%; margin-bottom: 25px; border-radius: 4px; }
.kicker { font-size: 9px; letter-spacing: .18em; opacity: .45; }
#panelTitle { margin: 8px 0 20px; font-size: 27px; font-weight: 400; }
#panelText { font-size: 14px; line-height: 1.7; opacity: .8; white-space: pre-wrap; }
#panelPdf {
  display: none; margin-top: 25px;
  padding: 10px 14px; border-radius: 4px;
  background: white; color: black;
  text-decoration: none; font-size: 10px;
}

@media (max-width: 600px) {
  #contentPanel {
    width: 100%; max-width: 100%;
    top: auto; height: 72%; padding: 25px;
    transform: translateY(100%);
  }
  #contentPanel.active { transform: translateY(0); }
}
</style>
</head>
<body>

<div id="map"></div>

<aside id="contentPanel">
  <button id="closePanel">×</button>
  <img id="panelImage" src="" alt="">
  <div class="kicker">LOCATION</div>
  <h2 id="panelTitle"></h2>
  <div id="panelText"></div>
  <a id="panelPdf" href="#" target="_blank">PDF öffnen</a>
</aside>

<script>
mapboxgl.accessToken = "pk.eyJ1IjoibGVvbnJvY2EiLCJhIjoiY21wYmY1Yjl6MDNxczJxc2U0MzByNHA3OCJ9.-BaGJWtZCr3lKDKP1o9THQ";

const map = new mapboxgl.Map({
  container: "map",
  style: "mapbox://styles/mapbox/dark-v11",
  center: [8.5417, 47.3769],
  zoom: 12
});

const contentPanel = document.getElementById("contentPanel");
const closePanel = document.getElementById("closePanel");
const panelTitle = document.getElementById("panelTitle");
const panelText = document.getElementById("panelText");
const panelImage = document.getElementById("panelImage");
const panelPdf = document.getElementById("panelPdf");

closePanel.addEventListener("click", function () {
  contentPanel.classList.remove("active");
});

function openPoint(point) {
  panelTitle.innerText = point.title || "Punkt";
  panelText.innerText = point.text || "";

  if (point.image_url && point.image_url.trim()) {
    panelImage.src = point.image_url;
    panelImage.style.display = "block";
  } else {
    panelImage.src = "";
    panelImage.style.display = "none";
  }

  if (point.pdf_url && point.pdf_url.trim()) {
    panelPdf.href = point.pdf_url;
    panelPdf.style.display = "inline-block";
  } else {
    panelPdf.style.display = "none";
  }

  contentPanel.classList.add("active");
}

function drawRoute(route) {
  const id = "route-" + route.id;

  if (map.getSource(id)) return;

  let coordinates = route.coordinates;
  if (typeof coordinates === "string") {
    coordinates = JSON.parse(coordinates);
  }

  map.addSource(id, {
    type: "geojson",
    data: {
      type: "Feature",
      geometry: { type: "LineString", coordinates: coordinates },
      properties: {}
    }
  });

  map.addLayer({
    id: id,
    type: "line",
    source: id,
    layout: {
      "line-cap": "round",
      "line-join": "round",
      visibility: route.visible === 0 ? "none" : "visible"
    },
    paint: {
      "line-color": route.color || "#ff453a",
      "line-width": Number(route.width || 5),
      "line-opacity": .9
    }
  });
}

function createMarker(point) {
  if (point.visible === 0) return;

  const element = document.createElement("div");
  element.className = "marker";

  new mapboxgl.Marker({ element: element })
    .setLngLat([point.lng, point.lat])
    .addTo(map);

  element.addEventListener("click", function (event) {
    event.stopPropagation();
    openPoint(point);
  });
}

async function loadData() {
  try {
    const [pointsResponse, routesResponse] = await Promise.all([
      fetch("/api/points"),
      fetch("/api/routes")
    ]);

    const points = await pointsResponse.json();
    const routes = await routesResponse.json();

    routes.forEach(drawRoute);
    points.forEach(createMarker);
  } catch (error) {
    console.error("Konnte Daten nicht laden:", error);
  }
}

map.on("load", loadData);
</script>

</body>
</html>
